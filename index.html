<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단동훼리 단체 관리</title>

<!-- FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f4f6f9;color:#202733}
header{background:#17324d;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{margin:0;font-size:20px}
.wrap{max-width:1100px;margin:20px auto;padding:0 18px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px #0000000d}
#calendar{background:white;padding:20px;border-radius:12px;}
.date-title{font-size:18px;font-weight:bold;color:#17324d;margin-bottom:15px;display:flex;align-items:center;gap:10px;}
.team-card{border:1px solid #c3d1e0;background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:16px}
.team-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #e1e7ef;padding-bottom:10px}
h2{font-size:16px;margin:0 0 12px}
label{font-size:12px;color:#5c6673;display:block;margin-bottom:4px}
input,select,button,textarea{font:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ccd3dc;border-radius:7px;background:white}
input.assignPeople{background:#e3f2fd !important; border:1px solid #90caf9 !important; font-weight:bold; color:#0d47a1;}
button{border:0;border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:700}
.primary{background:#1769aa;color:#fff}
.secondary{background:#e9eef4;color:#263746}
.success{background:#2e7d32;color:#fff}
.danger{background:#fff0f0;color:#b3261e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px;border-radius:9px;background:#f3f6f9}.stat b{display:block;font-size:22px;margin-top:5px}
.small{font-size:11px;color:#687583}
.hidden{display:none!important}
.warn-box{padding:10px 12px;background:#fff0f0;border:1px solid #f3c2c2;border-radius:8px;font-size:13px;margin-top:12px}

/* 테이블 가로 스크롤 지원 */
.table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
th,td{padding:9px;border-bottom:1px solid #e4e8ed;text-align:left}
th{background:#f1f4f7}
.bad{color:#b3261e;font-weight:700}
.type-card{border:1px solid #dde3ea;border-radius:8px;padding:10px;margin-bottom:8px;background:white}
.type-grid{display:grid;grid-template-columns:2fr 1.5fr 1.5fr 1.5fr 40px;gap:8px;align-items:center}
.master-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:10px;background:#f0f4f8;padding:12px;border-radius:8px;}
.master-card{background:white;padding:10px;border-radius:8px;border:1px solid #dcdfe6;}
.memo-box{background:#fff; border:1px dashed #cbd5e1; padding:8px 10px; border-radius:6px; margin-top:8px; font-size:12px; color:#334155;}

/* 모바일 가시성 개선 CSS */
@media (max-width: 768px) {
  header{padding:12px 16px;}
  header h1{font-size:16px;}
  .wrap{padding:0 10px; margin:10px auto;}
  .card{padding:12px; margin-bottom:12px;}
  #calendar{padding:10px;}
  .fc .fc-toolbar-title{font-size:16px;}
  .fc .fc-button{padding:4px 8px; font-size:12px;}
  .stats{grid-template-columns:1fr;} /* 모바일에서 요약 카드를 세로 배치 */
  .stat{padding:10px;}
  .stat b{font-size:18px;}
  .type-grid{grid-template-columns:1fr 1fr; gap:6px;} /* 객실 입력 단계를 2열로 정리 */
  .type-grid > div:last-child{grid-column: span 2; text-align:right;}
  .master-grid{grid-template-columns:1fr 1fr;}
  button{padding:7px 10px; font-size:12px;}
}
</style>
</head>
<body>

<header>
  <div>
    <h1 style="display:inline-block; margin-right:15px;">📅 단동훼리 단체 관리</h1>
    <span style="font-size:12px; opacity:0.8; display:block;">원하는 날짜를 클릭하여 작성 및 조회하세요.</span>
  </div>
  <button style="background:#d32f2f; color:white; padding:9px 15px; font-size:13px;" onclick="openEventModal()">🚫 휴항/메모 별도 등록</button>
</header>

<div class="wrap">
  <!-- 달력 영역 -->
  <div class="card">
    <div id="calendar"></div>
  </div>

  <!-- 1. 별도 휴항/메모 등록 카드 -->
  <div id="eventSection" class="hidden card" style="border: 2px solid #d32f2f;">
    <div class="date-title">
      <span>🚫 [휴항 및 메모 등록]</span>
      <button class="secondary" style="font-size:12px; margin-left:auto;" onclick="closeEventSection()">닫기 ✕</button>
    </div>
    <div style="display:grid; gap:12px; max-width:600px;">
      <div>
        <label style="font-weight:bold;">날짜 선택</label>
        <input type="date" id="eventDate" onchange="loadEventDataForDate(this.value)">
      </div>
      <div>
        <label style="font-weight:bold;">표시 구분</label>
        <select id="eventType">
          <option value="⛔ 휴항">⛔ 휴항</option>
          <option value="🔧 정기점검">🔧 정기점검</option>
          <option value="✏️ 메모">✏️ 일반 메모 (내용만 표시)</option>
        </select>
      </div>
      <div>
        <label style="font-weight:bold;">상세 메모/내용</label>
        <input type="text" id="eventTitle" placeholder="예: 선박 정기점검으로 인한 휴항 / 메모 내용 입력">
      </div>
      <div>
        <label style="font-weight:bold;">배경 색상</label>
        <select id="eventColor">
          <option value="#d32f2f">빨간색 (휴항/경고)</option>
          <option value="#ed6c02">주황색 (점검/주의)</option>
          <option value="#0288d1">파란색 (일반)</option>
          <option value="#2e7d32">초록색 (정상)</option>
        </select>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="primary" style="background:#d32f2f;" onclick="saveCustomEvent()">저장하기</button>
        <button class="danger" onclick="deleteCustomEvent()">이 날짜 메모/휴항 삭제</button>
      </div>
    </div>
  </div>

  <!-- 2. 선택한 날짜 시뮬레이터 영역 -->
  <div id="simSection" class="hidden">
    <div class="card" style="border: 2px solid #1769aa; margin-bottom: 16px;">
      <div class="date-title" style="margin-bottom:0;">
        <span>📌 선택된 날짜: <span id="selectedDateText" style="color:#1769aa;"></span></span>
        <button class="secondary" style="font-size:12px; margin-left:auto;" onclick="closeSimSection()">닫기 ✕</button>
      </div>
    </div>

    <!-- [상단] 시뮬레이션 결과 요약 영역 -->
    <div id="simResult" class="hidden">
      <div style="text-align:right; margin-bottom:10px;">
        <button class="success" onclick="downloadResultImage()">📸 결과 이미지 다운로드 (PNG)</button>
      </div>
      <div id="captureArea" style="background:#f4f6f9; padding:10px; border-radius:12px; margin-bottom: 16px;">
        <div class="card">
          <h2>1. 전체 합산 비중 요약 (일반 여객 + 단체)</h2>
          <div class="stats" id="simStats"></div>
          <h3 style="margin-top:20px; margin-bottom:10px; font-size:14px;">전체 보유 객실 대비 총 사용 비중</h3>
          <div class="table-responsive">
            <table id="totalTypeTable"></table>
          </div>
          <div id="simWarn"></div>
        </div>
        <div class="card">
          <h2>2. 단체별 배정 상세 및 비중</h2>
          <div id="teamResultsContainer"></div>
        </div>
      </div>
    </div>

    <!-- [하단] 입력 및 설정 영역 -->
    <div class="card">
      <h2>3. 선박 전체 보유 객실 및 일반 여객 설정</h2>
      <div class="master-grid" id="masterRoomsContainer"></div>

      <h2 style="margin-top:20px;">4. 단체(팀) 및 객실별 인원 설정</h2>
      <div id="teamsContainer"></div>
      <button class="secondary" style="margin-top:8px" onclick="addTeam()">+ 별도 단체 추가</button>

      <div style="margin-top:20px; border-top:1px solid #eee; padding-top:16px; display:flex; gap:10px;">
        <button class="primary" style="font-size:15px;padding:12px 20px" onclick="runSimulation()">계산 및 서버 저장</button>
        <button class="danger" onclick="deleteDateData()">이 날짜 데이터 삭제</button>
      </div>
    </div>
  </div>
</div>

<script>
// 1. 구글 Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyCxQ8kYN_VL6-_8oqhrUv3TjV-Yjpimo00",
  authDomain: "dd-group-2c8e8.firebaseapp.com",
  projectId: "dd-group-2c8e8",
  storageBucket: "dd-group-2c8e8.firebasestorage.app",
  messagingSenderId: "35622249443",
  appId: "1:35622249443:web:ee7e139f1ca0e3792af6d6",
  measurementId: "G-Y3GQZF3T59"
};

let db = null;
try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
} catch(e) {
  console.log("Firebase 로드 오류:", e);
}

// 2. 변수 및 기본 객실 구조
let selectedDate = "";
let calendar = null;
let teamSeq = 0;

let masterRooms = {
  "6": { label: "6인실", totalRooms: 143, defaultCapPerRoom: 4, generalPeople: 100, generalCap: 3 },
  "4": { label: "4인실", totalRooms: 124, defaultCapPerRoom: 4, generalPeople: 50, generalCap: 2 },
  "2": { label: "2인실", totalRooms: 15, defaultCapPerRoom: 2, generalPeople: "", generalCap: "" },
  "dadami24": { label: "다다미 24인실", totalRooms: 2, defaultCapPerRoom: 24, generalPeople: "", generalCap: "" },
  "dadami36": { label: "다다미 36인실", totalRooms: 1, defaultCapPerRoom: 36, generalPeople: "", generalCap: "" }
};

function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }

// 3. 달력 초기화
document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'ko',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: ''
    },
    dateClick: function(info) {
      closeEventSection();
      openDateSim(info.dateStr);
    },
    eventSources: [
      // A) 한국 공휴일 API
      {
        events: async function(fetchInfo, successCallback) {
          try {
            const year = fetchInfo.start.getFullYear();
            const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
            const holidays = await res.json();
            const holidayEvents = holidays.map(h => ({
              title: `🔴 ${h.localName}`,
              start: h.date,
              allDay: true,
              backgroundColor: '#fff0f0',
              borderColor: '#f3c2c2',
              textColor: '#d32f2f'
            }));
            successCallback(holidayEvents);
          } catch(e) { successCallback([]); }
        }
      },
      // B) Firebase 단체 예약 데이터 (일반인 제외, 단체 인원만 표시)
      {
        events: function(fetchInfo, successCallback) {
          if(!db) { successCallback([]); return; }
          db.collection("schedules").get().then((querySnapshot) => {
            let events = [];
            querySnapshot.forEach((doc) => {
              const data = doc.data();
              const groupPeople = data.groupTotalPeople || 0;
              events.push({
                id: doc.id,
                title: `👥 단체 ${groupPeople}명 (${data.teamCount}팀)`,
                start: doc.id,
                color: '#1769aa'
              });
            });
            successCallback(events);
          }).catch(() => successCallback([]));
        }
      },
      // C) Firebase 휴항/메모 데이터
      {
        events: function(fetchInfo, successCallback) {
          if(!db) { successCallback([]); return; }
          db.collection("custom_events").get().then((querySnapshot) => {
            let events = [];
            querySnapshot.forEach((doc) => {
              const data = doc.data();
              let displayTitle = "";
              
              if(data.type === "✏️ 메모") {
                displayTitle = data.title ? `✏️ ${data.title}` : "✏️ 메모";
              } else {
                displayTitle = `${data.type} ${data.title ? '- ' + data.title : ''}`;
              }

              events.push({
                id: "ce_" + doc.id,
                title: displayTitle,
                start: doc.id,
                color: data.color || '#d32f2f'
              });
            });
            successCallback(events);
          }).catch(() => successCallback([]));
        }
      }
    ]
  });
  calendar.render();
});

// 4. 별도 버튼 클릭으로 휴항/메모 등록 화면 열기
function openEventModal(){
  closeSimSection();
  const eventSection = document.getElementById("eventSection");
  eventSection.classList.remove("hidden");
  
  const today = new Date().toISOString().split('T')[0];
  document.getElementById("eventDate").value = today;
  loadEventDataForDate(today);
  
  eventSection.scrollIntoView({ behavior: 'smooth' });
}

function loadEventDataForDate(dateStr){
  if(!dateStr) return;
  document.getElementById("eventType").value = "⛔ 휴항";
  document.getElementById("eventTitle").value = "";
  document.getElementById("eventColor").value = "#d32f2f";

  if(db){
    db.collection("custom_events").doc(dateStr).get().then(doc => {
      if(doc.exists){
        const data = doc.data();
        document.getElementById("eventType").value = data.type || "⛔ 휴항";
        document.getElementById("eventTitle").value = data.title || "";
        document.getElementById("eventColor").value = data.color || "#d32f2f";
      }
    });
  }
}

function closeEventSection(){
  document.getElementById("eventSection").classList.add("hidden");
}

function saveCustomEvent(){
  const dateStr = document.getElementById("eventDate").value;
  if(!dateStr){ alert("날짜를 선택해주세요."); return; }

  const type = document.getElementById("eventType").value;
  const title = document.getElementById("eventTitle").value.trim();
  const color = document.getElementById("eventColor").value;

  if(db){
    db.collection("custom_events").doc(dateStr).set({
      type, title, color, updatedAt: new Date()
    }).then(() => {
      alert(`[${dateStr}] 일정/휴항 정보가 저장되었습니다.`);
      closeEventSection();
      if(calendar) calendar.refetchEvents();
    });
  }
}

function deleteCustomEvent(){
  const dateStr = document.getElementById("eventDate").value;
  if(!dateStr) return;
  
  if(confirm(`정말로 ${dateStr} 날짜의 메모/휴항 일정을 삭제하시겠습니까?`)){
    if(db){
      db.collection("custom_events").doc(dateStr).delete().then(() => {
        alert("삭제되었습니다.");
        closeEventSection();
        if(calendar) calendar.refetchEvents();
      });
    }
  }
}

// 5. 시뮬레이터 로직
function openDateSim(dateStr){
  selectedDate = dateStr;
  document.getElementById("selectedDateText").innerText = dateStr;
  document.getElementById("simSection").classList.remove("hidden");
  
  resetMasterData();
  document.getElementById("teamsContainer").innerHTML = "";
  document.getElementById("simResult").classList.add("hidden");

  if(db){
    db.collection("schedules").doc(dateStr).get().then((doc) => {
      if(doc.exists){
        const data = doc.data();
        if(data.masterRooms) masterRooms = data.masterRooms;
        initMasterRoomsUI();
        if(data.teams && data.teams.length > 0){
          data.teams.forEach(t => restoreTeamUI(t));
        } else { addTeam("팀명"); }
        runSimulation(false);
      } else {
        initMasterRoomsUI();
        addTeam("팀명");
      }
    }).catch(() => {
      initMasterRoomsUI();
      addTeam("팀명");
    });
  } else {
    initMasterRoomsUI();
    addTeam("팀명");
  }

  document.getElementById("simSection").scrollIntoView({ behavior: 'smooth' });
}

function closeSimSection(){
  document.getElementById("simSection").classList.add("hidden");
}

function resetMasterData(){
  masterRooms = {
    "6": { label: "6인실", totalRooms: 143, defaultCapPerRoom: 4, generalPeople: 100, generalCap: 3 },
    "4": { label: "4인실", totalRooms: 124, defaultCapPerRoom: 4, generalPeople: 50, generalCap: 2 },
    "2": { label: "2인실", totalRooms: 15, defaultCapPerRoom: 2, generalPeople: "", generalCap: "" },
    "dadami24": { label: "다다미 24인실", totalRooms: 2, defaultCapPerRoom: 24, generalPeople: "", generalCap: "" },
    "dadami36": { label: "다다미 36인실", totalRooms: 1, defaultCapPerRoom: 36, generalPeople: "", generalCap: "" }
  };
}

function initMasterRoomsUI(){
  const container = document.getElementById("masterRoomsContainer");
  container.innerHTML = "";
  Object.keys(masterRooms).forEach(key => {
    const room = masterRooms[key];
    const people = parseInt(room.generalPeople, 10) || 0;
    const cap = parseInt(room.generalCap, 10) || 0;
    const genRooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
    const remainRooms = Math.max(0, room.totalRooms - genRooms);

    const div = document.createElement("div");
    div.className = "master-card";
    div.innerHTML = `
      <div style="font-weight:bold; font-size:13px; margin-bottom:6px; color:#17324d;">${room.label}</div>
      <div style="margin-bottom:4px;">
        <label>보유 수</label>
        <input type="number" id="master_room_${key}" min="0" value="${room.totalRooms}" onchange="updateMasterRoom('${key}')">
      </div>
      <div style="margin-bottom:4px;">
        <label>일반 인원</label>
        <input type="number" id="master_gen_people_${key}" min="0" placeholder="공란" value="${room.generalPeople}" onchange="updateMasterRoom('${key}')">
      </div>
      <div style="margin-bottom:4px;">
        <label>객실 당 인원</label>
        <input type="number" id="master_gen_cap_${key}" min="1" placeholder="공란" value="${room.generalCap}" onchange="updateMasterRoom('${key}')">
      </div>
      <div class="small" style="background:#f5f5f5; padding:4px; border-radius:4px; margin-top:4px;">
        차감: <b id="calc_gen_room_${key}">${genRooms}</b>실 | 잔여: <b id="calc_remain_room_${key}" style="color:#1769aa;">${remainRooms}</b>실
      </div>
    `;
    container.appendChild(div);
  });
}

function updateMasterRoom(key){
  const totalVal = parseInt(document.getElementById(`master_room_${key}`).value, 10);
  const peopleVal = parseInt(document.getElementById(`master_gen_people_${key}`).value, 10);
  const capVal = parseInt(document.getElementById(`master_gen_cap_${key}`).value, 10);

  masterRooms[key].totalRooms = isNaN(totalVal) ? 0 : Math.max(0, totalVal);
  masterRooms[key].generalPeople = isNaN(peopleVal) ? "" : Math.max(0, peopleVal);
  masterRooms[key].generalCap = isNaN(capVal) ? "" : Math.max(0, capVal);

  const people = parseInt(masterRooms[key].generalPeople, 10) || 0;
  const cap = parseInt(masterRooms[key].generalCap, 10) || 0;
  const genRooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
  const remainRooms = Math.max(0, masterRooms[key].totalRooms - genRooms);

  document.getElementById(`calc_gen_room_${key}`).innerText = genRooms;
  document.getElementById(`calc_remain_room_${key}`).innerText = remainRooms;
}

function addTeam(name="", price="", memo=""){
  const teamId = "team_" + (teamSeq++);
  const teamDiv = document.createElement("div");
  teamDiv.className = "team-card";
  teamDiv.id = teamId;
  teamDiv.innerHTML = `
    <div class="team-head">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex:1;">
        <input type="text" class="teamName" placeholder="단체명" value="${esc(name)}" style="max-width:180px; font-weight:bold;">
        <input type="text" class="teamPrice" placeholder="금액 (예: 189)" value="${esc(price)}" style="max-width:140px;">
      </div>
      <button class="danger" type="button" onclick="document.getElementById('${teamId}').remove()">삭제</button>
    </div>
    <div style="margin-bottom:10px;">
      <textarea class="teamMemo" placeholder="단체 특이사항 메모 (선택 입력)" rows="2">${esc(memo)}</textarea>
    </div>
    <div class="roomTypesContainer"></div>
    <button class="secondary" type="button" style="font-size:12px; padding:4px 8px; margin-top:4px;" onclick="addRoomTypeToTeam('${teamId}')">+ 객실 종류 추가</button>
  `;
  document.getElementById("teamsContainer").appendChild(teamDiv);
  addRoomTypeToTeam(teamId, "6", "", 4);
}

function restoreTeamUI(teamData){
  const teamId = "team_" + (teamSeq++);
  const teamDiv = document.createElement("div");
  teamDiv.className = "team-card";
  teamDiv.id = teamId;
  teamDiv.innerHTML = `
    <div class="team-head">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex:1;">
        <input type="text" class="teamName" placeholder="단체명" value="${esc(teamData.name)}" style="max-width:180px; font-weight:bold;">
        <input type="text" class="teamPrice" placeholder="금액 (예: 189)" value="${esc(teamData.price || '')}" style="max-width:140px;">
      </div>
      <button class="danger" type="button" onclick="document.getElementById('${teamId}').remove()">삭제</button>
    </div>
    <div style="margin-bottom:10px;">
      <textarea class="teamMemo" placeholder="단체 특이사항 메모 (선택 입력)" rows="2">${esc(teamData.memo || '')}</textarea>
    </div>
    <div class="roomTypesContainer"></div>
    <button class="secondary" type="button" style="font-size:12px; padding:4px 8px; margin-top:4px;" onclick="addRoomTypeToTeam('${teamId}')">+ 객실 종류 추가</button>
  `;
  document.getElementById("teamsContainer").appendChild(teamDiv);

  if(teamData.allocations){
    teamData.allocations.forEach(a => {
      addRoomTypeToTeam(teamId, a.key, a.people, a.cap);
    });
  }
}

function addRoomTypeToTeam(teamId, presetKey="6", assignPeople="", capPerRoom=""){
  const container = document.getElementById(teamId).querySelector(".roomTypesContainer");
  const typeId = teamId + "_type_" + Date.now() + "_" + Math.floor(Math.random()*1000);
  const preset = masterRooms[presetKey];
  const cap = capPerRoom || preset.defaultCapPerRoom;

  const div = document.createElement("div");
  div.className = "type-card";
  div.id = typeId;
  div.innerHTML = `
    <div class="type-grid">
      <div>
        <label>객실 종류</label>
        <select class="typeSelect">
          <option value="6">6인실</option>
          <option value="4">4인실</option>
          <option value="2">2인실</option>
          <option value="dadami24">다다미 24인실</option>
          <option value="dadami36">다다미 36인실</option>
        </select>
      </div>
      <div>
        <label style="color:#0d47a1; font-weight:bold;">배정 인원(명)</label>
        <input type="number" class="assignPeople" min="1" value="${assignPeople}">
      </div>
      <div>
        <label>객실당 인원</label>
        <input type="number" class="capPerRoom" min="1" value="${cap}">
      </div>
      <div style="text-align:right; margin-top:16px;">
        <button class="danger" type="button" style="padding:6px 8px;" onclick="document.getElementById('${typeId}').remove()">✕</button>
      </div>
    </div>
  `;
  container.appendChild(div);
  div.querySelector(".typeSelect").value = presetKey;
}

function runSimulation(shouldSave = true){
  const teamCards = [...document.querySelectorAll("#teamsContainer .team-card")];
  if(!teamCards.length){ alert("최소 1개 이상의 단체를 추가해주세요."); return; }

  let teams = [];
  let groupRoomUsed = { "6": 0, "4": 0, "2": 0, "dadami24": 0, "dadami36": 0 };

  teamCards.forEach((card, idx) => {
    const name = card.querySelector(".teamName").value.trim() || `단체 ${idx+1}`;
    const price = card.querySelector(".teamPrice").value.trim();
    const memo = card.querySelector(".teamMemo").value.trim();
    const typeDivs = [...card.querySelectorAll(".type-card")];

    let teamTotalPeople = 0;
    let allocations = [];

    typeDivs.forEach(td => {
      const key = td.querySelector(".typeSelect").value;
      const people = parseInt(td.querySelector(".assignPeople").value, 10) || 0;
      const cap = parseInt(td.querySelector(".capPerRoom").value, 10) || 1;

      if(people > 0){
        teamTotalPeople += people;
        const roomsNeeded = Math.ceil(people / cap);
        allocations.push({ key, label: masterRooms[key].label, people, cap, roomsNeeded, totalRooms: masterRooms[key].totalRooms });
        groupRoomUsed[key] += roomsNeeded;
      }
    });

    if(teamTotalPeople > 0){
      teams.push({ name, price, memo, totalPeople: teamTotalPeople, allocations });
    }
  });

  const groupTotalPeople = teams.reduce((s,t) => s + t.totalPeople, 0);
  const groupTotalRooms = Object.values(groupRoomUsed).reduce((a,b)=>a+b, 0);

  let generalTotalPeople = 0;
  let generalRoomUsed = {};

  Object.keys(masterRooms).forEach(key => {
    const preset = masterRooms[key];
    const people = parseInt(preset.generalPeople, 10) || 0;
    const cap = parseInt(preset.generalCap, 10) || 0;
    const genRooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
    generalTotalPeople += people;
    generalRoomUsed[key] = genRooms;
  });

  const grandTotalPeople = generalTotalPeople + groupTotalPeople;

  document.getElementById("simStats").innerHTML = `
    <div class="stat">총 인원 (일반+단체)<b>${grandTotalPeople}명</b><span>일반 ${generalTotalPeople}명 + 단체 ${groupTotalPeople}명</span></div>
    <div class="stat">단체 전체 인원<b>${groupTotalPeople}명</b><span>총 ${teams.length}개 단체</span></div>
    <div class="stat">단체 필요 객실<b>${groupTotalRooms}개</b><span>단체 신청 객실 합계</span></div>
  `;

  let totalTypeHtml = `<thead><tr><th>객실 종류</th><th>전체 보유 수</th><th>일반 여객</th><th>단체 신청</th><th>총 사용 객실</th><th>보유 대비 비중</th></tr></thead><tbody>`;
  let overLimit = false;

  Object.keys(masterRooms).forEach(key => {
    const preset = masterRooms[key];
    const total = preset.totalRooms;
    const genUsed = generalRoomUsed[key];
    const grpUsed = groupRoomUsed[key];
    const totalUsed = genUsed + grpUsed;
    const genPeople = parseInt(preset.generalPeople, 10) || 0;
    
    let pctStr = "—";
    if(total > 0){
      const pct = (totalUsed / total * 100).toFixed(1);
      pctStr = `<b>${pct}%</b> (${totalUsed}/${total}개)`;
      if(totalUsed > total) overLimit = true;
    }

    totalTypeHtml += `<tr>
      <td><b>${preset.label}</b></td>
      <td>${total > 0 ? total + "개" : "무제한"}</td>
      <td>${genPeople > 0 ? `${genPeople}명 (${genUsed}개)` : "0개"}</td>
      <td>${grpUsed}개</td>
      <td class="${total > 0 && totalUsed > total ? 'bad' : ''}"><b>${totalUsed}개</b></td>
      <td>${pctStr}</td>
    </tr>`;
  });
  totalTypeHtml += `</tbody>`;
  document.getElementById("totalTypeTable").innerHTML = totalTypeHtml;

  if(overLimit){
    document.getElementById("simWarn").innerHTML = `<div class="warn-box"><span class="bad">⚠ 초과 경고:</span> 총 객실 신청량이 보유 객실 수를 초과했습니다.</div>`;
  } else {
    document.getElementById("simWarn").innerHTML = "";
  }

  /* 2. 단체별 배정 상세 및 비중 영역 - '인원 비중' 삭제 반영 */
  let teamResultsHtml = "";
  teams.forEach(team => {
    const teamTotalRooms = team.allocations.reduce((s,a)=>s+a.roomsNeeded, 0);
    const priceText = team.price ? ` | 💵 ${esc(team.price)}` : '';
    
    teamResultsHtml += `<div style="margin-bottom:16px;">
      <h3 style="margin-bottom:4px; color:#1769aa;">🚩 ${esc(team.name)} — 총 ${team.totalPeople}명 (${teamTotalRooms}실)${priceText}</h3>
      ${team.memo ? `<div class="memo-box"><b>📌 단체 메모:</b> ${esc(team.memo)}</div>` : ''}
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>객실 종류</th>
              <th>인원</th>
              <th>수용 설정</th>
              <th>필요 객실</th>
              <th>보유 대비 비중</th>
            </tr>
          </thead>
          <tbody>`;
    team.allocations.forEach(a => {
      const roomHoldPct = a.totalRooms > 0 ? (a.roomsNeeded / a.totalRooms * 100).toFixed(1) + `% (${a.roomsNeeded}/${a.totalRooms}개)` : "—";
      teamResultsHtml += `<tr>
        <td><b>${esc(a.label)}</b></td>
        <td>${a.people}명</td>
        <td>${a.cap}명/실</td>
        <td>${a.roomsNeeded}개</td>
        <td><b>${roomHoldPct}</b></td>
      </tr>`;
    });
    teamResultsHtml += `</tbody></table></div></div>`;
  });

  document.getElementById("teamResultsContainer").innerHTML = teamResultsHtml;
  document.getElementById("simResult").classList.remove("hidden");

  if(shouldSave && db && selectedDate){
    db.collection("schedules").doc(selectedDate).set({
      totalPeople: grandTotalPeople,
      groupTotalPeople: groupTotalPeople, // 단체 인원 별도 저장
      teamCount: teams.length,
      masterRooms: masterRooms,
      teams: teams,
      updatedAt: new Date()
    }).then(() => {
      alert(`[${selectedDate}] 객실 배정 정보가 서버에 성공적으로 저장되었습니다.`);
      if(calendar) calendar.refetchEvents();
    }).catch(err => {
      alert("저장 중 오류 발생: " + err);
    });
  }
}

function deleteDateData(){
  if(!selectedDate) return;
  if(confirm(`정말로 ${selectedDate} 날짜의 데이터를 삭제하시겠습니까?`)){
    if(db){
      db.collection("schedules").doc(selectedDate).delete().then(() => {
        alert("삭제되었습니다.");
        closeSimSection();
        if(calendar) calendar.refetchEvents();
      });
    }
  }
}

function downloadResultImage(){
  const area = document.getElementById("captureArea");
  html2canvas(area, { scale: 2, backgroundColor: "#f4f6f9" }).then(canvas => {
    const link = document.createElement("a");
    link.download = `단동훼리_객실배정_${selectedDate}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}
