<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단체 여정 및 달력 관리 시스템</title>
  
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <!-- SheetJS (Excel Download) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* 1. 달력 주말 색상 설정 (토: 파란색, 일: 빨간색) */
    .fc-day-sat a {
      color: #0056b3 !important; /* 토요일 파란색 */
      font-weight: bold;
    }
    .fc-day-sun a {
      color: #dc3545 !important; /* 일요일 빨간색 */
      font-weight: bold;
    }

    /* 입력 폼 스타일 */
    .form-section {
      background: #e9ecef;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .form-group {
      display: inline-block;
      margin-right: 15px;
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input, .form-group select {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-primary { background-color: #0d6efd; color: white; }
    .btn-primary:hover { background-color: #0b5ed7; }

    /* Custom Toolbar Button */
    .fc-excelBtn-button {
      background-color: #198754 !important;
      border-color: #198754 !important;
      color: white !important;
    }
    
    .fc-event {
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>단체 여정 관리 시스템</h1>

  <!-- 신규 등록 폼 -->
  <div class="form-section">
    <h3>[신규 등록] 출발 단체 및 여정 설정</h3>
    <form id="groupForm">
      <div class="form-group">
        <label for="groupName">단체 이름</label>
        <input type="text" id="groupName" required placeholder="예: A투어 1팀">
      </div>
      <div class="form-group">
        <label for="peopleCount">인원 수 (명)</label>
        <input type="number" id="peopleCount" required min="1" value="321" style="width: 90px;">
      </div>
      <div class="form-group">
        <label for="startDate">출국일 (출발일)</label>
        <input type="date" id="startDate" required>
      </div>
      <div class="form-group">
        <label for="nights">일정 (N박)</label>
        <input type="number" id="nights" min="1" value="4" required style="width: 70px;"> 박
      </div>
      <button type="submit" class="btn btn-primary">단체 등록</button>
    </form>
  </div>

  <!-- 달력 영역 -->
  <div id="calendar"></div>
</div>

<script>
  // 오늘 날짜 구하기 (YYYY-MM-DD)
  const todayStr = new Date().toISOString().split('T')[0];

  // 샘플 데이터 (월요일 출발 예시 테스트)
  let groupDataList = [
    { 
      id: 1, 
      name: '샘플 A투어', 
      peopleCount: 321, 
      startDate: '2026-09-07', // 월요일
      nights: 4, 
      returnDepartureDate: calculateReturnDepartureDate('2026-09-07', 4) // 목요일 (2026-09-10)
    }
  ];

  let calendar = null;

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('startDate').value = todayStr;

    const calendarEl = document.getElementById('calendar');

    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'ko',
      initialDate: '2026-09-01', // 샘플 데이터를 바로 확인하실 수 있도록 2026년 9월로 기본 설정
      headerToolbar: {
        left: 'prev,next today excelBtn',
        center: 'title',
        right: 'dayGridMonth'
      },
      customButtons: {
        excelBtn: {
          text: '한 달치 요약 통계 (Excel)',
          click: function() {
            exportMonthlySummaryToExcel();
          }
        }
      },
      events: getCalendarEvents(),
      eventClick: function(info) {
        const groupId = info.event.extendedProps.groupId;
        const group = groupDataList.find(g => g.id === groupId);
        
        if (group) {
          const confirmDelete = confirm(
            `[단체 상세 정보]\n` +
            `- 단체명: ${group.name}\n` +
            `- 인원: ${group.peopleCount}명\n` +
            `- 출발일: ${group.startDate}\n` +
            `- 일정: ${group.nights}박\n` +
            `- 재출국일: ${group.returnDepartureDate}\n\n` +
            `이 단체를 삭제하시겠습니까?`
          );

          if (confirmDelete) {
            groupDataList = groupDataList.filter(g => g.id !== groupId);
            refreshCalendar();
            alert('삭제되었습니다.');
          }
        }
      }
    });

    calendar.render();
  });

  // 재출국일 계산 로직 (월 출발 4박 -> 목요일 재출국 = 출발일 + 3일)
  function calculateReturnDepartureDate(startDateStr, nights) {
    const startDate = new Date(startDateStr);
    const daysToAdd = parseInt(nights) - 1; // 4박인 경우 +3일
    
    const returnDate = new Date(startDate);
    returnDate.setDate(startDate.getDate() + daysToAdd);
    
    return returnDate.toISOString().split('T')[0];
  }

  // 달력 이벤트 데이터 생성 (출발일 + 재출국일 이벤트 각각 생성)
  function getCalendarEvents() {
    const events = [];

    groupDataList.forEach(group => {
      // 1. 출발일 이벤트 (파란색)
      events.push({
        title: `${group.name} (${group.peopleCount}명)`,
        start: group.startDate,
        backgroundColor: '#0d6efd',
        borderColor: '#0d6efd',
        extendedProps: { groupId: group.id, type: 'start' }
      });

      // 2. 재출국일 이벤트 ("출321" 형식 - 주황/빨간색 계열)
      events.push({
        title: `출${group.peopleCount}`,
        start: group.returnDepartureDate,
        backgroundColor: '#fd7e14', // 재출국일 강조색 (주황색)
        borderColor: '#fd7e14',
        extendedProps: { groupId: group.id, type: 'return' }
      });
    });

    return events;
  }

  // 달력 새로고침
  function refreshCalendar() {
    calendar.removeAllEvents();
    calendar.addEventSource(getCalendarEvents());
  }

  // 폼 제출 이벤트
  document.getElementById('groupForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('groupName').value;
    const peopleCount = parseInt(document.getElementById('peopleCount').value);
    const startDate = document.getElementById('startDate').value;
    const nights = parseInt(document.getElementById('nights').value);

    // 재출국일 계산
    const returnDepartureDate = calculateReturnDepartureDate(startDate, nights);

    const newGroup = {
      id: Date.now(),
      name: name,
      peopleCount: peopleCount,
      startDate: startDate,
      nights: nights,
      returnDepartureDate: returnDepartureDate
    };

    groupDataList.push(newGroup);
    
    refreshCalendar();

    alert(`단체가 등록되었습니다.\n- 출발일: ${startDate}\n- 재출국일: ${returnDepartureDate} (표시: 출${peopleCount})`);
    
    this.reset();
    document.getElementById('startDate').value = todayStr;
  });

  // 한 달치 요약 엑셀 다운로드
  function exportMonthlySummaryToExcel() {
    const currentViewDate = calendar.getDate();
    const currentYear = currentViewDate.getFullYear();
    const currentMonth = currentViewDate.getMonth();

    const filteredGroups = groupDataList.filter(group => {
      const gDate = new Date(group.startDate);
      return gDate.getFullYear() === currentYear && gDate.getMonth() === currentMonth;
    });

    if (filteredGroups.length === 0) {
      alert('현재 화면에 보이는 달에 등록된 단체 데이터가 없습니다.');
      return;
    }

    const excelRows = [];
    let totalPeople = 0;

    filteredGroups.forEach(group => {
      const departureDate = new Date(group.startDate);
      const dayOfWeek = departureDate.getDay(); 

      let category = '';
      if ([1, 3, 5].includes(dayOfWeek)) {
        category = '출국(out)';
      } else if ([2, 4, 6].includes(dayOfWeek)) {
        category = '입국(in)';
      } else {
        category = '기타(일요일)';
      }

      excelRows.push({
        '구분': category,
        '출발일': group.startDate,
        '단체 이름': group.name,
        '인원': group.peopleCount,
        '재출국일': group.returnDepartureDate,
        '재출국 표기': `출${group.peopleCount}`
      });

      totalPeople += group.peopleCount;
    });

    excelRows.push({
      '구분': '총 합계',
      '출발일': '-',
      '단체 이름': '-',
      '인원': totalPeople,
      '재출국일': '-',
      '재출국 표기': '-'
    });

    const worksheet = XLSX.utils.json_to_sheet(excelRows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "월간 요약 통계");

    const fileName = `${currentYear}_${currentMonth + 1}월_요약통계.xlsx`;
    XLSX.writeFile(workbook, fileName);
  }
</script>

</body>
</html>
