<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단동훼리 단체 관리 시스템</title>

<!-- FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f4f6f9;color:#202733}
header{background:#17324d;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{margin:0;font-size:20px}
.wrap{max-width:1100px;margin:20px auto;padding:0 18px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px #0000000d}
#calendar{background:white;padding:20px;border-radius:12px;}
.date-title{font-size:18px;font-weight:bold;color:#17324d;margin-bottom:15px;display:flex;align-items:center;gap:10px;}
.team-card{border:1px solid #c3d1e0;background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:16px}
.team-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #e1e7ef;padding-bottom:10px;gap:8px;flex-wrap:wrap;}
h2{font-size:16px;margin:0 0 12px}
label{font-size:12px;color:#5c6673;display:block;margin-bottom:4px}
input,select,button,textarea{font:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ccd3dc;border-radius:7px;background:white}
input.assignPeople{background:#e3f2fd !important; border:1px solid #90caf9 !important; font-weight:bold; color:#0d47a1;}
button{border:0;border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:700}
.primary{background:#1769aa;color:#fff}
.secondary{background:#e9eef4;color:#263746}
.success{background:#2e7d32;color:#fff}
.danger{background:#fff0f0;color:#b3261e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px;border-radius:9px;background:#f3f6f9;}.stat b{display:block;font-size:22px;margin-top:5px}
.small{font-size:11px;color:#687583}
.hidden{display:none!important}
.warn-box{padding:10px 12px;background:#fff0f0;border:1px solid #f3c2c2;border-radius:8px;font-size:13px;margin-top:12px}

.table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
th,td{padding:9px;border-bottom:1px solid #e4e8ed;text-align:left}
th{background:#f1f4f7}
.bad{color:#b3261e;font-weight:700}
.type-card{border:1px solid #dde3ea;border-radius:8px;padding:10px;margin-bottom:8px;background:white}
.type-grid{display:grid;grid-template-columns:2fr 1.5fr 1.5fr 1.5fr 40px;gap:8px;align-items:center}
.master-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:10px;background:#f0f4f8;padding:12px;border-radius:8px;}
.master-card{background:white;padding:10px;border-radius:8px;border:1px solid #dcdfe6;}
.memo-box{background:#fff; border:1px dashed #cbd5e1; padding:8px 10px; border-radius:6px; margin-top:8px; font-size:12px; color:#334155;}
.tag-pattern{background:#e3f2fd; color:#0d47a1; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}
.tag-linked{background:#e8f5e9; color:#2e7d32; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}

.section-subtitle{font-size:13px; font-weight:bold; color:#1769aa; margin:8px 0 4px 0; border-left:3px solid #1769aa; padding-left:6px;}

.in-team-chip{display:inline-flex; align-items:center; gap:6px; background:#e8f5e9; border:1px solid #c8e6c9; color:#2e7d32; padding:6px 12px; border-radius:20px; font-size:13px; font-weight:bold; margin:4px;}

/* 접기/펼치기 스타일 */
.collapsible-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  background: #f0f4f8;
  border: 1px solid #dcdfe6;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  color: #17324d;
  transition: background 0.2s;
}
.collapsible-toggle:hover {
  background: #e2e8f0;
}

@media (max-width: 768px) {
  header{padding:12px 16px;}
  header h1{font-size:16px;}
  .wrap{padding:0 10px; margin:10px auto;}
  .card{padding:12px; margin-bottom:12px;}
  #calendar{padding:10px;}
  .fc .fc-toolbar-title{font-size:16px;}
  .fc .fc-button{padding:4px 8px; font-size:12px;}
  .stats{grid-template-columns:1fr;}
  .stat{padding:10px;}
  .stat b{font-size:18px;}
  .type-grid{grid-template-columns:1fr 1fr; gap:6px;}
  .type-grid > div:last-child{grid-column: span 2; text-align:right;}
  .master-grid{grid-template-columns:1fr 1fr;}
  button{padding:7px 10px; font-size:12px;}
}
</style>
</head>
<body>

<header>
  <div>
    <h1 style="display:inline-block; margin-right:15px;">📅 단동훼리 단체 관리</h1>
    <span style="font-size:12px; opacity:0.8; display:block;">출국/입국 스마트 여정 및 객실 관리</span>
  </div>
  <button style="background:#d32f2f; color:white; padding:9px 15px; font-size:13px;" onclick="openEventModal()">🚫 휴항/메모 별도 등록</button>
</header>

<div class="wrap">
  <!-- 달력 -->
  <div class="card">
    <div id="calendar"></div>
  </div>

  <!-- 1. 별도 휴항/메모 등록 카드 -->
  <div id="eventSection" class="hidden card" style="border: 2px solid #d32f2f;">
    <div class="date-title">
      <span>🚫 [휴항 및 메모 등록]</span>
      <button class="secondary" style="font-size:12px; margin-left:auto;" onclick="closeEventSection()">닫기 ✕</button>
    </div>
    <div style="display:grid; gap:12px; max-width:600px;">
      <div>
        <label style="font-weight:bold;">날짜 선택</label>
        <input type="date" id="eventDate" onchange="loadEventDataForDate(this.value)">
      </div>
      <div>
        <label style="font-weight:bold;">표시 구분</label>
        <select id="eventType">
          <option value="⛔ 휴항">⛔ 휴항</option>
          <option value="🔧 정기점검">🔧 정기점검</option>
          <option value="✏️ 메모">✏️ 일반 메모</option>
        </select>
      </div>
      <div>
        <label style="font-weight:bold;">상세 메모/내용</label>
        <input type="text" id="eventTitle" placeholder="내용 입력">
      </div>
      <div>
        <label style="font-weight:bold;">배경 색상</label>
        <select id="eventColor">
          <option value="#d32f2f">빨간색 (휴항)</option>
          <option value="#ed6c02">주황색 (점검)</option>
          <option value="#0288d1">파란색 (메모)</option>
        </select>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="primary" style="background:#d32f2f;" onclick="saveCustomEvent()">저장하기</button>
        <button class="danger" onclick="deleteCustomEvent()">삭제</button>
      </div>
    </div>
  </div>

  <!-- 2. 선택 날짜 시뮬레이터 -->
  <div id="simSection" class="hidden">
    <div class="card" style="border: 2px solid #1769aa; margin-bottom: 16px;">
      <div class="date-title" style="margin-bottom:0;">
        <span>📌 선택 날짜: <span id="selectedDateText" style="color:#1769aa;"></span></span>
        <button class="secondary" style="font-size:12px; margin-left:auto;" onclick="closeSimSection()">닫기 ✕</button>
      </div>
    </div>

    <!-- 시뮬레이션 결과 요약 -->
    <div id="simResult" class="hidden">
      <div style="text-align:right; margin-bottom:10px;">
        <button class="success" onclick="downloadResultImage()">📸 결과 이미지 다운로드 (PNG)</button>
      </div>
      <div id="captureArea" style="background:#f4f6f9; padding:10px; border-radius:12px; margin-bottom: 16px;">
        <div class="card">
          <h2>1. 선택 날짜 출국 승선 요약</h2>
          <div class="stats" id="simStats"></div>
          <h3 style="margin-top:20px; margin-bottom:10px; font-size:14px;">보유 객실 대비 사용 비중 (출국 승선 기준)</h3>
          <div class="table-responsive">
            <table id="totalTypeTable"></table>
          </div>
          <div id="simWarn"></div>
        </div>

        <div class="card">
          <h2>2. 오늘 출국 승선 단체 상세 여정</h2>
          <div id="teamResultsContainer"></div>
        </div>

        <!-- 오늘 입국 단체 간략 요약 카드 -->
        <div class="card">
          <h2>3. 오늘 입국 단체 요약 (총 <span id="inTeamTotalPeople" style="color:#2e7d32;">0</span>명 / <span id="inTeamCount">0</span>개 단체)</h2>
          <div id="inTeamSummaryContainer" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;"></div>
        </div>
      </div>
    </div>

    <!-- 입력 및 설정 영역 -->
    <div class="card">
      <!-- 4. 보유 객실 설정 (접기/펼치기 적용) -->
      <div style="margin-bottom:16px;">
        <button type="button" class="collapsible-toggle" onclick="toggleMasterArea()">
          <span>⚙️ 4. 선박 전체 보유 객실 및 일반 여객 설정</span>
          <span id="masterToggleIcon">▼ 열기</span>
        </button>
        <div id="masterAreaContent" class="hidden" style="margin-top:10px;">
          <div class="master-grid" id="masterRoomsContainer"></div>
        </div>
      </div>

      <h2>5. [신규 등록] 출발 단체 및 여정 설정</h2>
      <div id="teamsContainer"></div>
      <button class="secondary" style="margin-top:8px" onclick="addTeam()">+ 단체 추가</button>

      <div style="margin-top:20px; border-top:1px solid #eee; padding-top:16px; display:flex; gap:10px;">
        <button class="primary" style="font-size:15px;padding:12px 20px" onclick="runSimulation(true)">계산 및 서버 저장</button>
        <button class="danger" onclick="deleteDateData()">이 날짜 데이터 삭제</button>
      </div>
    </div>
  </div>
</div>

<script>
// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyCxQ8kYN_VL6-_8oqhrUv3TjV-Yjpimo00",
  authDomain: "dd-group-2c8e8.firebaseapp.com",
  projectId: "dd-group-2c8e8",
  storageBucket: "dd-group-2c8e8.firebasestorage.app",
  messagingSenderId: "35622249443",
  appId: "1:35622249443:web:ee7e139f1ca0e3792af6d6"
};

let db = null;
try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
} catch(e) { console.log(e); }

let selectedDate = "";
let calendar = null;
let teamSeq = 0;
let linkedReturnTeams = []; // 과거 날짜에서 건너온 오늘 승선 단체들
let allInboundTeams = [];   // 오늘 입국하는 모든 단체

let masterRooms = {
  "6": { label: "6인실", totalRooms: 143, defaultCapPerRoom: 4, generalPeople: 100, generalCap: 3 },
  "4": { label: "4인실", totalRooms: 124, defaultCapPerRoom: 4, generalPeople: 50, generalCap: 2 },
  "2": { label: "2인실", totalRooms: 15, defaultCapPerRoom: 2, generalPeople: "", generalCap: "" },
  "dadami24": { label: "다다미 24인실", totalRooms: 2, defaultCapPerRoom: 24, generalPeople: "", generalCap: "" },
  "dadami36": { label: "다다미 36인실", totalRooms: 1, defaultCapPerRoom: 36, generalPeople: "", generalCap: "" }
};

function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }

function addDays(dateStr, days) {
  const result = new Date(dateStr);
  result.setDate(result.getDate() + parseInt(days, 10));
  return result.toISOString().split('T')[0];
}

function formatShortDate(dateStr) {
  if (!dateStr || dateStr.length < 10) return dateStr;
  return dateStr.substring(5);
}

// 보유 객실 영역 접기/펼치기
function toggleMasterArea(){
  const content = document.getElementById("masterAreaContent");
  const icon = document.getElementById("masterToggleIcon");
  if(content.classList.contains("hidden")){
    content.classList.remove("hidden");
    icon.innerText = "▲ 접기";
  } else {
    content.classList.add("hidden");
    icon.innerText = "▼ 열기";
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'ko',
    headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
    dateClick: function(info) {
      closeEventSection();
      openDateSim(info.dateStr);
    },
    eventSources: [
      {
        events: async function(fetchInfo, successCallback) {
          try {
            const year = fetchInfo.start.getFullYear();
            const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
            const holidays = await res.json();
            successCallback(holidays.map(h => ({
              title: `🔴 ${h.localName}`, start: h.date, allDay: true,
              backgroundColor: '#fff0f0', borderColor: '#f3c2c2', textColor: '#d32f2f'
            })));
          } catch(e) { successCallback([]); }
        }
      },
      {
        events: function(fetchInfo, successCallback) {
          if(!db) { successCallback([]); return; }
          db.collection("schedules").get().then((querySnapshot) => {
            let dailyOut = {}; 
            let dailyIn = {};  

            querySnapshot.forEach((doc) => {
              const regDate = doc.id;
              const data = doc.data();
              if (data.teams && data.teams.length > 0) {
                data.teams.forEach(t => {
                  const p = t.totalPeople || 0;
                  const nights = parseInt(t.nights || 4, 10);
                  const pattern = t.pattern || 'KR_ROUND';
                  const returnDate = addDays(regDate, nights);

                  if (pattern === 'KR_ROUND') {
                    dailyOut[regDate] = (dailyOut[regDate] || 0) + p;
                    dailyIn[returnDate] = (dailyIn[returnDate] || 0) + p;
                  } else if (pattern === 'CN_ROUND') {
                    dailyIn[regDate] = (dailyIn[regDate] || 0) + p;
                    dailyOut[returnDate] = (dailyOut[returnDate] || 0) + p;
                  } else {
                    if (t.pattern === 'ONEWAY_IN') {
                      dailyIn[regDate] = (dailyIn[regDate] || 0) + p;
                    } else {
                      dailyOut[regDate] = (dailyOut[regDate] || 0) + p;
                    }
                  }
                });
              }
            });

            let events = [];
            Object.keys(dailyOut).forEach(d => {
              if (dailyOut[d] > 0) {
                events.push({ title: `출${dailyOut[d]}`, start: d, color: '#1769aa' });
              }
            });
            Object.keys(dailyIn).forEach(d => {
              if (dailyIn[d] > 0) {
                events.push({ title: `입${dailyIn[d]}`, start: d, color: '#2e7d32' });
              }
            });

            successCallback(events);
          }).catch(() => successCallback([]));
        }
      },
      {
        events: function(fetchInfo, successCallback) {
          if(!db) { successCallback([]); return; }
          db.collection("custom_events").get().then((querySnapshot) => {
            let events = [];
            querySnapshot.forEach((doc) => {
              const data = doc.data();
              events.push({
                id: "ce_" + doc.id,
                title: data.type === "✏️ 메모" ? (data.title ? `✏️ ${data.title}` : "✏️ 메모") : `${data.type} ${data.title ? '- ' + data.title : ''}`,
                start: doc.id,
                color: data.color || '#d32f2f'
              });
            });
            successCallback(events);
          }).catch(() => successCallback([]));
        }
      }
    ]
  });
  calendar.render();
});

function openEventModal(){
  closeSimSection();
  const eventSection = document.getElementById("eventSection");
  eventSection.classList.remove("hidden");
  const today = new Date().toISOString().split('T')[0];
  document.getElementById("eventDate").value = today;
  loadEventDataForDate(today);
  eventSection.scrollIntoView({ behavior: 'smooth' });
}

function loadEventDataForDate(dateStr){
  if(!dateStr) return;
  document.getElementById("eventType").value = "⛔ 휴항";
  document.getElementById("eventTitle").value = "";
  document.getElementById("eventColor").value = "#d32f2f";
  if(db){
    db.collection("custom_events").doc(dateStr).get().then(doc => {
      if(doc.exists){
        const data = doc.data();
        document.getElementById("eventType").value = data.type || "⛔ 휴항";
        document.getElementById("eventTitle").value = data.title || "";
        document.getElementById("eventColor").value = data.color || "#d32f2f";
      }
    });
  }
}

function closeEventSection(){ document.getElementById("eventSection").classList.add("hidden"); }

function saveCustomEvent(){
  const dateStr = document.getElementById("eventDate").value;
  if(!dateStr){ alert("날짜를 선택해주세요."); return; }
  const type = document.getElementById("eventType").value;
  const title = document.getElementById("eventTitle").value.trim();
  const color = document.getElementById("eventColor").value;

  if(db){
    db.collection("custom_events").doc(dateStr).set({ type, title, color, updatedAt: new Date() }).then(() => {
      alert(`[${dateStr}] 일정이 저장되었습니다.`);
      closeEventSection();
      if(calendar) calendar.refetchEvents();
    });
  }
}

function deleteCustomEvent(){
  const dateStr = document.getElementById("eventDate").value;
  if(!dateStr) return;
  if(confirm(`정말로 ${dateStr} 일정을 삭제하시겠습니까?`)){
    if(db){
      db.collection("custom_events").doc(dateStr).delete().then(() => {
        alert("삭제되었습니다.");
        closeEventSection();
        if(calendar) calendar.refetchEvents();
      });
    }
  }
}

// 선택 날짜 오픈
async function openDateSim(dateStr){
  selectedDate = dateStr;
  document.getElementById("selectedDateText").innerText = dateStr;
  document.getElementById("simSection").classList.remove("hidden");
  
  resetMasterData();
  document.getElementById("teamsContainer").innerHTML = "";
  document.getElementById("simResult").classList.add("hidden");
  linkedReturnTeams = [];
  allInboundTeams = [];

  if (db) {
    try {
      const allDocs = await db.collection("schedules").get();
      allDocs.forEach(doc => {
        const regDate = doc.id;
        if (regDate !== dateStr) {
          const data = doc.data();
          if (data.teams && data.teams.length > 0) {
            data.teams.forEach(t => {
              const nights = parseInt(t.nights || 4, 10);
              const retDate = addDays(regDate, nights);
              if (retDate === dateStr) {
                linkedReturnTeams.push({
                  ...t,
                  regDate: regDate,
                  isReturnOnTarget: true
                });

                if (t.pattern === 'KR_ROUND') {
                  allInboundTeams.push({ name: t.name, people: t.totalPeople, type: "🇰🇷 복귀 입국" });
                }
              }
            });
          }
        }
      });
    } catch(e) { console.error("복귀 단체 조회 오류", e); }
  }

  if(db){
    db.collection("schedules").doc(dateStr).get().then((doc) => {
      if(doc.exists){
        const data = doc.data();
        if(data.masterRooms) masterRooms = data.masterRooms;
        initMasterRoomsUI();
        if(data.teams && data.teams.length > 0){
          data.teams.forEach(t => restoreTeamUI(t));
        } else { addTeam(); }
        runSimulation(false);
      } else {
        initMasterRoomsUI();
        addTeam();
      }
    }).catch(() => {
      initMasterRoomsUI();
      addTeam();
    });
  } else {
    initMasterRoomsUI();
    addTeam();
  }

  document.getElementById("simSection").scrollIntoView({ behavior: 'smooth' });
}

function closeSimSection(){ document.getElementById("simSection").classList.add("hidden"); }

function resetMasterData(){
  masterRooms = {
    "6": { label: "6인실", totalRooms: 143, defaultCapPerRoom: 4, generalPeople: 100, generalCap: 3 },
    "4": { label: "4인실", totalRooms: 124, defaultCapPerRoom: 4, generalPeople: 50, generalCap: 2 },
    "2": { label: "2인실", totalRooms: 15, defaultCapPerRoom: 2, generalPeople: "", generalCap: "" },
    "dadami24": { label: "다다미 24인실", totalRooms: 2, defaultCapPerRoom: 24, generalPeople: "", generalCap: "" },
    "dadami36": { label: "다다미 36인실", totalRooms: 1, defaultCapPerRoom: 36, generalPeople: "", generalCap: "" }
  };
}

function initMasterRoomsUI(){
  const container = document.getElementById("masterRoomsContainer");
  container.innerHTML = "";
  Object.keys(masterRooms).forEach(key => {
    const room = masterRooms[key];
    const people = parseInt(room.generalPeople, 10) || 0;
    const cap = parseInt(room.generalCap, 10) || 0;
    const genRooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
    const remainRooms = Math.max(0, room.totalRooms - genRooms);

    const div = document.createElement("div");
    div.className = "master-card";
    div.innerHTML = `

function updateMasterRoom(key){
  const totalVal = parseInt(document.getElementById(`master_room_${key}`).value, 10);
  const peopleVal = parseInt(document.getElementById(`master_gen_people_${key}`).value, 10);
  const capVal = parseInt(document.getElementById(`master_gen_cap_${key}`).value, 10);

  masterRooms[key].totalRooms = isNaN(totalVal) ? 0 : Math.max(0, totalVal);
  masterRooms[key].generalPeople = isNaN(peopleVal) ? "" : Math.max(0, peopleVal);
  masterRooms[key].generalCap = isNaN(capVal) ? "" : Math.max(0, capVal);

  const people = parseInt(masterRooms[key].generalPeople, 10) || 0;
  const cap = parseInt(masterRooms[key].generalCap, 10) || 0;
  const genRooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
  const remainRooms = Math.max(0, masterRooms[key].totalRooms - genRooms);

  document.getElementById(`calc_gen_room_${key}`).innerText = genRooms;
  document.getElementById(`calc_remain_room_${key}`).innerText = remainRooms;
}

    const normalDivs = [...card.querySelectorAll(".roomTypesContainer .type-card")];

  if(masterRooms[key]){
    card.querySelector(".capPerRoom").value = masterRooms[key].defaultCapPerRoom;

function collectAllocationsFromContainer(containerEl) {
  let allocs = [];
  const cards = containerEl.querySelectorAll(".type-card");
  cards.forEach(card => {
    const key = card.querySelector(".typeSelect").value;
    const people = parseInt(card.querySelector(".assignPeople").value, 10) || 0;
    const cap = parseInt(card.querySelector(".capPerRoom").value, 10) || 1;
    const rooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
    
    card.querySelector(".calcRooms").value = rooms + "실";

    if(people > 0) {
      allocs.push({ key, people, cap, rooms, label: masterRooms[key]?.label || key });
    }
  });
  return allocs;
}

function runSimulation(shouldSave=false){
  let teamDataList = [];
  let masterUsageOut = {}; 
  
  Object.keys(masterRooms).forEach(k => {
    masterUsageOut[k] = { rooms: 0, people: 0 };
  });

  // 1. 오늘 날짜로 새로 입력한 단체들 처리
  const teamCards = document.querySelectorAll("#teamsContainer .team-card");
  teamCards.forEach(card => {
    const name = card.querySelector(".teamName").value.trim() || "무명 단체";
    const pattern = card.querySelector(".teamPattern").value;
    const nights = parseInt(card.querySelector(".teamNights").value || 4, 10);
    const price = card.querySelector(".teamPrice").value.trim();
    const memo = card.querySelector(".teamMemo").value.trim();
    const isSplitRoom = card.querySelector(".splitRoomCheck").checked;

    let allocations = [];
    let outAllocations = [];
    let inAllocations = [];
    let totalPeople = 0;

    if(!isSplitRoom) {
      allocations = collectAllocationsFromContainer(card.querySelector(".roomTypesContainer"));
      totalPeople = allocations.reduce((sum, a) => sum + a.people, 0);
    } else {
      outAllocations = collectAllocationsFromContainer(card.querySelector(".outRoomTypesContainer"));
      inAllocations = collectAllocationsFromContainer(card.querySelector(".inRoomTypesContainer"));
      totalPeople = Math.max(
        outAllocations.reduce((sum, a) => sum + a.people, 0),
        inAllocations.reduce((sum, a) => sum + a.people, 0)
      );
    }

    teamDataList.push({
      name, pattern, nights, price, memo, isSplitRoom,
      totalPeople, allocations, outAllocations, inAllocations
    });
  });

  // 오늘 출국 승선 계산 (신규 등록 단체)
  teamDataList.forEach(t => {
    const isOutboundToday = (t.pattern === 'KR_ROUND' || t.pattern === 'ONEWAY_OUT');
    if(isOutboundToday) {
      const activeAllocs = t.isSplitRoom ? t.outAllocations : t.allocations;
      activeAllocs.forEach(a => {
        if(masterUsageOut[a.key]){
          masterUsageOut[a.key].rooms += a.rooms;
          masterUsageOut[a.key].people += a.people;
        }
      });
    }

    if(t.pattern === 'CN_ROUND' || t.pattern === 'ONEWAY_IN') {
      allInboundTeams.push({ name: t.name, people: t.totalPeople, type: t.pattern === 'CN_ROUND' ? "🇨🇳 중국발 입국" : "⬅️ 편도 입국" });
    }
  });

  // 오늘 출국 승선 계산 (과거 날짜에서 연동된 CN_ROUND 출국)
  linkedReturnTeams.forEach(t => {
    if (t.pattern === 'CN_ROUND') {
      const activeAllocs = t.isSplitRoom ? (t.outAllocations || []) : (t.allocations || []);
      activeAllocs.forEach(a => {
        if(masterUsageOut[a.key]){
          masterUsageOut[a.key].rooms += (a.rooms || 0);
          masterUsageOut[a.key].people += (a.people || 0);
        }
      });
    }
  });

  // UI 렌더링
  renderSimResult(teamDataList, masterUsageOut);

  if(shouldSave && db){
    db.collection("schedules").doc(selectedDate).set({
      masterRooms: masterRooms,
      teams: teamDataList,
      updatedAt: new Date()
    }).then(() => {
      alert(`[${selectedDate}] 데이터가 저장되었습니다.`);
      if(calendar) calendar.refetchEvents();
    }).catch(e => {
      alert("저장 오류: " + e.message);
    });
  }
}

function renderSimResult(teamDataList, masterUsageOut){
  document.getElementById("simResult").classList.remove("hidden");

  let totalOutboundPeople = 0;
  let totalOutboundTeamsCount = 0;

  // 1. 신규 오늘 출국 단체
  teamDataList.forEach(t => {
    if(t.pattern === 'KR_ROUND' || t.pattern === 'ONEWAY_OUT') {
      totalOutboundPeople += t.totalPeople;
      totalOutboundTeamsCount++;
    }
  });
  // 2. 과거에서 연결된 CN_ROUND 복귀 출국 단체
  linkedReturnTeams.forEach(t => {
    if(t.pattern === 'CN_ROUND') {
      totalOutboundPeople += (t.totalPeople || 0);
      totalOutboundTeamsCount++;
    }
  });

  // 통계 카드
  const statsDiv = document.getElementById("simStats");
  statsDiv.innerHTML = `
    <div class="stat"><span>총 출국 승선 인원</span><b style="color:#1769aa;">${totalOutboundPeople} 명</b></div>
    <div class="stat"><span>총 출국 승선 단체</span><b>${totalOutboundTeamsCount} 개</b></div>
    <div class="stat"><span>기준 날짜</span><b style="font-size:16px;">${selectedDate}</b></div>
  `;

  // 객실 현황 테이블
  let tableHtml = `
    <tr>
      <th>객실 종류</th>
      <th>총 보유</th>
      <th>일반 여객 차감</th>
      <th>잔여 객실</th>
      <th>오늘 출국 사용</th>
      <th>최종 남은 객실</th>
      <th>사용률</th>
    </tr>
  `;

  let warnings = [];

  Object.keys(masterRooms).forEach(k => {
    const m = masterRooms[k];
    const genP = parseInt(m.generalPeople, 10) || 0;
    const genCap = parseInt(m.generalCap, 10) || 0;
    const genRooms = (genP > 0 && genCap > 0) ? Math.ceil(genP / genCap) : 0;
    const remainAfterGen = Math.max(0, m.totalRooms - genRooms);

    const usedRooms = masterUsageOut[k] ? masterUsageOut[k].rooms : 0;
    const finalRemain = remainAfterGen - usedRooms;
    const usagePct = m.totalRooms > 0 ? Math.round(((genRooms + usedRooms) / m.totalRooms) * 100) : 0;

    if(finalRemain < 0) {
      warnings.push(`⚠️ [${m.label}] 보유 객실 초과! (${Math.abs(finalRemain)}실 부족)`);
    }

    tableHtml += `
      <tr>
        <td><b>${m.label}</b></td>
        <td>${m.totalRooms}실</td>
        <td>${genRooms}실 (${genP}명)</td>
        <td>${remainAfterGen}실</td>
        <td style="font-weight:bold; color:#1769aa;">${usedRooms}실 (${masterUsageOut[k]?.people || 0}명)</td>
        <td class="${finalRemain < 0 ? 'bad' : ''}">${finalRemain}실</td>
        <td>${usagePct}%</td>
      </tr>
    `;
  });

  document.getElementById("totalTypeTable").innerHTML = tableHtml;

  // 경고 표시
  const warnDiv = document.getElementById("simWarn");
  if(warnings.length > 0){
    warnDiv.innerHTML = `<div class="warn-box">${warnings.join("<br>")}</div>`;
  } else {
    warnDiv.innerHTML = "";
  }

  // 오늘 출국 승선 단체 상세 여정 렌더링
  const resultsContainer = document.getElementById("teamResultsContainer");
  resultsContainer.innerHTML = "";

  let outboundList = [];

  teamDataList.forEach(t => {
    if(t.pattern === 'KR_ROUND' || t.pattern === 'ONEWAY_OUT') {
      outboundList.push({ ...t, isLinked: false });
    }
  });

  linkedReturnTeams.forEach(t => {
    if(t.pattern === 'CN_ROUND') {
      outboundList.push({ ...t, isLinked: true });
    }
  });

  if(outboundList.length === 0){
    resultsContainer.innerHTML = "<div class='small' style='padding:10px;'>오늘 출국 승선하는 단체가 없습니다.</div>";
  } else {
    outboundList.forEach(t => {
      let patternText = "";
      let returnDateText = "";

      if(t.pattern === 'KR_ROUND') {
        patternText = "🇰🇷 한국발 왕복 (출➔입)";
        returnDateText = ` | <b>복귀 입국일: ${addDays(selectedDate, t.nights)}</b> (${t.nights}박)`;
      } else if(t.pattern === 'CN_ROUND') {
        patternText = "🇨🇳 중국발 왕복 (입➔출)";
        returnDateText = ` | <b>출발 등록일: ${t.regDate || '과거'}</b> (${t.nights}박)`;
      } else if(t.pattern === 'ONEWAY_OUT') {
        patternText = "➡️ 출국 전용 (편도)";
      }

      const activeAllocs = t.isSplitRoom 
        ? (t.pattern === 'CN_ROUND' ? (t.inAllocations || t.allocations || []) : (t.outAllocations || t.allocations || []))
        : (t.allocations || []);

      let roomSummaryStr = activeAllocs.map(a => `${a.label || masterRooms[a.key]?.label} ${a.rooms}실(${a.people}명)`).join(", ");

      const div = document.createElement("div");
      div.className = "team-card";
      div.style.background = t.isLinked ? "#f0fdf4" : "#ffffff";
      div.style.borderColor = t.isLinked ? "#bbf7d0" : "#c3d1e0";

      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
          <div>
            <span style="font-size:15px; font-weight:bold; color:#17324d;">${esc(t.name)}</span>
            <span style="font-size:14px; font-weight:bold; color:#1769aa; margin-left:8px;">(${t.totalPeople}명)</span>
            ${t.isLinked ? '<span class="tag-linked" style="margin-left:6px;">이전 등록 연동</span>' : ''}
          </div>
          <div>
            <span class="tag-pattern">${patternText}</span>
            ${t.price ? `<span style="font-size:12px; font-weight:bold; color:#2e7d32; margin-left:6px;">[${esc(t.price)}]</span>` : ''}
          </div>
        </div>
        <div style="font-size:12px; color:#475569; margin-top:6px;">
          📅 여정: <b>출국일: ${t.isLinked ? selectedDate : selectedDate}</b> ${returnDateText}
        </div>
        <div style="font-size:12px; color:#0d47a1; margin-top:4px; background:#e3f2fd; padding:6px 10px; border-radius:6px;">
          🛏️ 승선 객실: <b>${roomSummaryStr || '미설정'}</b>
        </div>
        ${t.memo ? `<div class="memo-box">📝 메모: ${esc(t.memo)}</div>` : ''}
      `;
      resultsContainer.appendChild(div);
    });
  }

  // 오늘 입국 단체 요약 렌더링
  const inContainer = document.getElementById("inTeamSummaryContainer");
  inContainer.innerHTML = "";

  // 중복 제거 및 렌더링
  let uniqueInbound = [];
  let totalInPeople = 0;

  allInboundTeams.forEach(t => {
    uniqueInbound.push(t);
    totalInPeople += (t.people || 0);
  });

  document.getElementById("inTeamTotalPeople").innerText = totalInPeople;
  document.getElementById("inTeamCount").innerText = uniqueInbound.length;

  if(uniqueInbound.length === 0){
    inContainer.innerHTML = "<span class='small'>오늘 입국하는 단체가 없습니다.</span>";
  } else {
    uniqueInbound.forEach(t => {
      const chip = document.createElement("div");
      chip.className = "in-team-chip";
      chip.innerHTML = `
        <span>🛬 ${esc(t.name)}</span>
        <span style="background:#2e7d32; color:white; border-radius:10px; padding:1px 7px; font-size:11px;">${t.people}명</span>
        <span style="font-size:10px; opacity:0.8;">(${t.type})</span>
      `;
      inContainer.appendChild(chip);
    });
  }
}

function deleteDateData(){
  if(!selectedDate) return;
  if(confirm(`정말로 ${selectedDate} 의 모든 입력 데이터를 삭제하시겠습니까?`)){
    if(db){
      db.collection("schedules").doc(selectedDate).delete().then(() => {
        alert("삭제되었습니다.");
        closeSimSection();
        if(calendar) calendar.refetchEvents();
      });
    }
  }
}

function downloadResultImage(){
  const area = document.getElementById("captureArea");
  html2canvas(area, { scale: 2 }).then(canvas => {
    const link = document.createElement('a');
    link.download = `단동훼리_현황_${selectedDate}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}
</script>
