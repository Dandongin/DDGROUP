<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단동훼리 단체 관리 시스템</title>

<!-- FullCalendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f4f6f9;color:#202733}
header{background:#17324d;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{margin:0;font-size:20px}
.wrap{max-width:1100px;margin:20px auto;padding:0 18px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 9px #0000000d}
#calendar{background:white;padding:20px;border-radius:12px;}
.date-title{font-size:18px;font-weight:bold;color:#17324d;margin-bottom:15px;display:flex;align-items:center;gap:10px;}
.team-card{border:1px solid #c3d1e0;background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:16px}
.team-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #e1e7ef;padding-bottom:10px;gap:8px;flex-wrap:wrap;}
h2{font-size:16px;margin:0 0 12px}
label{font-size:12px;color:#5c6673;display:block;margin-bottom:4px}
input,select,button,textarea{font:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ccd3dc;border-radius:7px;background:white}
input.assignPeople{background:#e3f2fd !important; border:1px solid #90caf9 !important; font-weight:bold; color:#0d47a1;}
button{border:0;border-radius:7px;padding:8px 12px;cursor:pointer;font-weight:700}
.primary{background:#1769aa;color:#fff}
.secondary{background:#e9eef4;color:#263746}
.success{background:#2e7d32;color:#fff}
.danger{background:#fff0f0;color:#b3261e}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px;border-radius:0;background:#f3f6f9;}.stat b{display:block;font-size:22px;margin-top:5px}
.small{font-size:11px;color:#687583}
.hidden{display:none!important}
.warn-box{padding:10px 12px;background:#fff0f0;border:1px solid #f3c2c2;border-radius:8px;font-size:13px;margin-top:12px}

.table-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
th,td{padding:9px;border-bottom:1px solid #e4e8ed;text-align:left}
th{background:#f1f4f7}
.bad{color:#b3261e;font-weight:700}
.type-card{border:1px solid #dde3ea;border-radius:8px;padding:10px;margin-bottom:8px;background:white}
.type-grid{display:grid;grid-template-columns:2fr 1.5fr 1.5fr 1.5fr 40px;gap:8px;align-items:center}
.master-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:10px;background:#f0f4f8;padding:12px;border-radius:8px;}
.master-card{background:white;padding:10px;border-radius:8px;border:1px solid #dcdfe6;}
.memo-box{background:#fff; border:1px dashed #cbd5e1; padding:8px 10px; border-radius:6px; margin-top:8px; font-size:12px; color:#334155;}
.tag-pattern{background:#e3f2fd; color:#0d47a1; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}
.tag-linked{background:#; color:#2e7d32; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold;}

.section-subtitle{font-size:13px; font-weight:bold; color:#1769aa; margin:8px 0 4px 0; border-left:3px solid #1769aa; padding-left:6px;}

/* 달력 요일 색상 지정 (토: 파란색, 일: 빨간색) */
.fc .fc-day-sat a { color: #0000ff !important; }
.fc .fc-day-sun a { color: #d32f2f !important; }

/* 접기/펼치기 스타일 */
.collapsible-toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  background: #f0f4f8;
  border: 1px solid #dcdfe6;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  color: #17324d;
  transition: background 0.2s;
}
.collapsible-toggle:hover {
  background: #e2e8f0;
}

@media (max-width: 768px) {
  header{padding:12px 16px;}
  header h1{font-size:16px;}
  .wrap{padding:0 10px; margin:10px auto;}
  .card{padding:12px; margin-bottom:12px;}
  #calendar{padding:10px;}
  .fc .fc-toolbar-title{font-size:16px;}
  .fc .fc-button{padding:4px 8px; font-size:12px;}
  .stats{grid-template-columns:1fr;}
  .stat{padding:10px;}
  .stat b{font-size:18px;}
  .type-grid{grid-template-columns:1fr 1fr; gap:6px;}
  .type-grid > div:last-child{grid-column: span 2; text-align:right;}
  .master-grid{grid-template-columns:1fr 1fr;}
  button{padding:7px 10px; font-size:12px;}
}
</style>
</head>
<body>

<header>
  <div>
    <h1 style="display:inline-block; margin-right:15px;">📅 단동훼리 단체 관리</h1>
    <span style="font-size:12px; opacity:0.8; display:block;">출국/입국 스마트 여정 및 객실 관리</span>
  </div>
  <button style="background:#d32f2f; color:white; padding:9px 15px; font-size:13px;" onclick="openEventModal()">휴항/메모 별도 등록</button>
</header>

<div class="wrap">
  <!-- 달력 -->
  <div class="card">
    <div id="calendar"></div>
  </div>

  <!-- 1. 메모 등록 -->
  <div id="eventSection" class="hidden card" style="border: 2px solid #d32f2f;">
    <div class="date-title">
      <span>[메모 등록]</span>
      <button class="secondary" style="font-size:12px; margin-left:auto;" onclick="closeEventSection()">닫기 ✕</button>
    </div>
    <div style="display:grid; gap:12px; max-width:600px;">
      <div>
        <label style="font-weight:bold;">날짜 선택</label>
        <input type="date" id="eventDate" onchange="loadEventDataForDate(this.value)">
      </div>
      <div>
        <label style="font-weight:bold;">상세 메모/내용</label>
        <input type="text" id="eventTitle" placeholder="내용 입력">
      </div>
      <div>
        <label style="font-weight:bold;">배경 색상 및 태그</label>
        <select id="eventColor">
          <option value="#fffde7">옅은 노란색</option>
          <option value="#9e9e9e">회색 </option>
          <option value="#4caf50">연두색 </option>
          <option value="#e1bee7">연보라색 (🇨🇳 오성홍기)</option>
          <option value="#f57c00">주황색 (🇰🇷 태극기)</option>
        </select>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="primary" style="background:#d32f2f;" onclick="saveCustomEvent()">저장하기</button>
        <button class="danger" onclick="deleteCustomEvent()">삭제</button>
      </div>
    </div>
  </div>

  <!-- 2. 선택 날짜 시뮬레이터 -->
  <div id="simSection" class="hidden">
    <div class="card" style="border: 2px solid #1769aa; margin-bottom: 16px;">
      <div class="date-title" style="margin-bottom:0;">
        <span>📌 선택 날짜: <span id="selectedDateText" style="color:#1769aa;"></span></span>
        <button class="secondary" style="font-size:12px; margin-left:auto;" onclick="closeSimSection()">닫기 ✕</button>
      </div>
    </div>

    <!-- 시뮬레이션 결과 요약 -->
    <div id="simResult" class="hidden">
      <div style="text-align:right; margin-bottom:10px;">
        <button class="success" onclick="downloadResultImage()">📸 결과 이미지 다운로드 (PNG)</button>
      </div>
      <div id="captureArea" style="background:#f4f6f9; padding:10px; border-radius:12px; margin-bottom: 16px;">
        <div class="card">
          <h2>1. 출국 요약</h2>
          <div class="stats" id="simStats"></div>
          <h3 style="margin-top:20px; margin-bottom:10px; font-size:14px;">보유 객실 대비 사용 비중 (출국 승선 기준)</h3>
          <div class="table-responsive">
            <table id="totalTypeTable"></table>
          </div>
          <div id="simWarn"></div>
        </div>

        <div class="card">
          <h2>2. 출국 단체 상세 </h2>
          <div id="teamResultsContainer"></div>
        </div>
      </div>
    </div>

    <!-- 입력 및 설정 영역 -->
    <div class="card">
      <div style="margin-bottom:16px;">
        <button type="button" class="collapsible-toggle" onclick="toggleMasterArea()">
          <span>⚙️ 객실 및 일반 여객 설정</span>
          <span id="masterToggleIcon">▼ 열기</span>
        </button>
        <div id="masterAreaContent" class="hidden" style="margin-top:10px;">
          <div class="master-grid" id="masterRoomsContainer"></div>
        </div>
      </div>

      <h2>[신규 등록] 출발 단체 및 여정 </h2>
      <div id="teamsContainer"></div>
      <button class="secondary" style="margin-top:8px" onclick="addTeam()">+ 단체 추가</button>

      <div style="margin-top:20px; border-top:1px solid #eee; padding-top:16px; display:flex; gap:10px;">
        <button class="primary" style="font-size:15px;padding:12px 20px" onclick="runSimulation(true)">기록 및 서버 저장</button>
        <button class="danger" onclick="deleteDateData()">이 날짜 데이터 삭제</button>
      </div>
    </div>
  </div>
</div>

<script>
// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyCxQ8kYN_VL6-_8oqhrUv3TjV-Yjpimo00",
  authDomain: "dd-group-2c8e8.firebaseapp.com",
  projectId: "dd-group-2c8e8",
  storageBucket: "dd-group-2c8e8.firebasestorage.app",
  messagingSenderId: "35622249443",
  appId: "1:35622249443:web:ee7e139f1ca0e3792af6d6"
};

let db = null;
try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }
} catch(e) { console.log(e); }

let selectedDate = "";
let calendar = null;
let teamSeq = 0;
let linkedReturnTeams = [];

let masterRooms = {
  "6": { label: "6인실", totalRooms: 143, defaultCapPerRoom: 4, generalPeople: 100, generalCap: 3 },
  "4": { label: "4인실", totalRooms: 124, defaultCapPerRoom: 4, generalPeople: 50, generalCap: 2 },
  "2": { label: "2인실", totalRooms: 15, defaultCapPerRoom: 2, generalPeople: "", generalCap: "" },
  "dadami24": { label: "다다미24", totalRooms: 2, defaultCapPerRoom: 24, generalPeople: "", generalCap: "" },
  "dadami36": { label: "다다미36", totalRooms: 1, defaultCapPerRoom: 36, generalPeople: "", generalCap: "" }
};

function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }

function getReturnDate(dateStr, nights) {
  const result = new Date(dateStr);
  const addDaysNum = Math.max(0, parseInt(nights, 10) - 1);
  result.setDate(result.getDate() + addDaysNum);
  return result.toISOString().split('T')[0];
}

function addDays(dateStr, days) {
  const result = new Date(dateStr);
  result.setDate(result.getDate() + parseInt(days, 10));
  return result.toISOString().split('T')[0];
}

function formatShortDate(dateStr) {
  if (!dateStr || dateStr.length < 10) return dateStr;
  return dateStr.substring(5);
}

function getDayColor(dateStr) {
  const dow = new Date(dateStr).getDay();
  if (dow === 2 || dow === 4 || dow === 0) {
    return '#FFB6C1'; // 화, 목, 일 (분홍색)
  } else if (dow === 1 || dow === 3 || dow === 5) {
    return '#87CEEB'; // 월, 수, 금 (하늘색)
  }
  return '#1769aa';
}

function normalizePattern(p){
  if (p === 'KR_ROUND' || p === 'CN_ROUND') return 'ROUND';
  return p || 'ROUND';
}

function toggleMasterArea(){
  const content = document.getElementById("masterAreaContent");
  const icon = document.getElementById("masterToggleIcon");
  if(content.classList.contains("hidden")){
    content.classList.remove("hidden");
    icon.innerText = "▲ 접기";
  } else {
    content.classList.add("hidden");
    icon.innerText = "▼ 열기";
  }
}

document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'ko',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'monthlyExport' },
    customButtons: {
      monthlyExport: {
        text: '📥 이번달 다운로드',
        click: function() {
          const viewStart = calendar.view.currentStart;
          downloadMonthlyExcel(viewStart.getFullYear(), viewStart.getMonth() + 1);
        }
      }
    },
    dateClick: function(info) {
      closeEventSection();
      openDateSim(info.dateStr);
    },
    eventClick: function(info) {
      closeEventSection();
      const dateStr = info.event.startStr ? info.event.startStr.split('T')[0] : null;
      if (dateStr) {
        openDateSim(dateStr);
      }
    },
    eventSources: [
      /* 1. 한국 공휴일 연동 (태극기 🇰🇷) */
      {
        events: async function(fetchInfo, successCallback) {
          try {
            const year = fetchInfo.start.getFullYear();
            const res = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
            const holidays = await res.json();
            successCallback(holidays.map(h => ({
              title: `🇰🇷 ${h.localName}`,
              start: h.date,
              allDay: true,
              backgroundColor: '#f57c00',
              borderColor: '#e65100',
              textColor: '#ffffff'
            })));
          } catch(e) { successCallback([]); }
        }
      },
      /* 2. 중국 주요 명절 지정 연동 (오성홍기 🇨🇳) */
      {
        events: function(fetchInfo, successCallback) {
          const year = fetchInfo.start.getFullYear();
          const cnHolidays = {
            2025: [
              { name: "원단", start: "2025-01-01", end: "2025-01-03" },
              { name: "춘절", start: "2025-01-28", end: "2025-02-04" },
              { name: "청명절", start: "2025-04-04", end: "2025-04-06" },
              { name: "노동절", start: "2025-05-01", end: "2025-05-05" },
              { name: "단오절", start: "2025-05-31", end: "2025-06-02" },
              { name: "국경절/추석", start: "2025-10-01", end: "2025-10-08" }
            ],
            2026: [
              { name: "원단", start: "2026-01-01", end: "2026-01-03" },
              { name: "춘절", start: "2026-02-15", end: "2026-02-23" },
              { name: "청명절", start: "2026-04-04", end: "2026-04-06" },
              { name: "노동절", start: "2026-05-01", end: "2026-05-05" },
              { name: "단오절", start: "2026-06-19", end: "2026-06-21" },
              { name: "추석", start: "2026-09-25", end: "2026-09-27" },
              { name: "국경절", start: "2026-10-01", end: "2026-10-07" }
            ]
          };

          let events = [];
          const list = cnHolidays[year] || [];

          list.forEach(h => {
            let cur = new Date(h.start);
            const end = new Date(h.end);
            while (cur <= end) {
              const dateStr = cur.toISOString().split('T')[0];
              events.push({
                title: `🇨🇳 ${h.name}`,
                start: dateStr,
                allDay: true,
                backgroundColor: '#e1bee7',
                borderColor: '#ce93d8',
                textColor: '#4a148c'
              });
              cur.setDate(cur.getDate() + 1);
            }
          });
          successCallback(events);
        }
      },
      /* 3. 승선 인원 요약 */
      {
        events: function(fetchInfo, successCallback) {
          if(!db) { successCallback([]); return; }
          db.collection("schedules").get().then((querySnapshot) => {
            let dailyAll = {};

            querySnapshot.forEach((doc) => {
              const regDate = doc.id;
              const data = doc.data();
              if (data.teams && data.teams.length > 0) {
                data.teams.forEach(t => {
                  const p = t.totalPeople || 0;
                  const nights = parseInt(t.nights || 4, 10);
                  const pattern = normalizePattern(t.pattern);
                  const returnDate = getReturnDate(regDate, nights);

                  if (pattern === 'ROUND') {
                    dailyAll[regDate] = (dailyAll[regDate] || 0) + p;
                    dailyAll[returnDate] = (dailyAll[returnDate] || 0) + p;
                  } else {
                    dailyAll[regDate] = (dailyAll[regDate] || 0) + p;
                  }
                });
              }
            });

            let events = [];
            Object.keys(dailyAll).forEach(d => {
              if (dailyAll[d] > 0) {
                events.push({ 
                  title: `출${dailyAll[d]}`, 
                  start: d, 
                  color: getDayColor(d),
                  textColor: '#000000'
                });
              }
            });

            successCallback(events);
          }).catch(() => successCallback([]));
        }
      },
      /* 4. 사용자 지정 메모/일정 */
      {
        events: function(fetchInfo, successCallback) {
          if(!db) { successCallback([]); return; }
          db.collection("custom_events").get().then((querySnapshot) => {
            let events = [];
            querySnapshot.forEach((doc) => {
              const data = doc.data();
              let evtColor = data.color || '#fffde7';
              let txtColor = '#000000';
              let titleText = data.title || "메모";

              if (evtColor === '#fffde7') {
                txtColor = '#f57f17';
              } else if (evtColor === '#9e9e9e') {
                txtColor = '#ffffff';
              } else if (evtColor === '#aed581' || evtColor === '#4caf50') {
                txtColor = '#1b5e20';
              } else if (evtColor === '#e1bee7') {
                txtColor = '#4a148c';
                if (!titleText.startsWith("🇨🇳")) titleText = `🇨🇳 ${titleText}`;
              } else if (evtColor === '#f57c00') {
                txtColor = '#ffffff';
                if (!titleText.startsWith("🇰🇷")) titleText = `🇰🇷 ${titleText}`;
              }

              events.push({
                id: "ce_" + doc.id,
                title: titleText,
                start: doc.id,
                color: evtColor,
                textColor: txtColor
              });
            });
            successCallback(events);
          }).catch(() => successCallback([]));
        }
      }
    ]
  });
  calendar.render();
});

function openEventModal(){
  closeSimSection();
  const eventSection = document.getElementById("eventSection");
  eventSection.classList.remove("hidden");
  const today = new Date().toISOString().split('T')[0];
  document.getElementById("eventDate").value = today;
  loadEventDataForDate(today);
  eventSection.scrollIntoView({ behavior: 'smooth' });
}

function loadEventDataForDate(dateStr){
  if(!dateStr) return;
  document.getElementById("eventTitle").value = "";
  document.getElementById("eventColor").value = "#fffde7";
  if(db){
    db.collection("custom_events").doc(dateStr).get().then(doc => {
      if(doc.exists){
        const data = doc.data();
        document.getElementById("eventTitle").value = data.title || "";
        document.getElementById("eventColor").value = data.color || "#fffde7";
      }
    });
  }
}

function closeEventSection(){ document.getElementById("eventSection").classList.add("hidden"); }

function saveCustomEvent(){
  const dateStr = document.getElementById("eventDate").value;
  if(!dateStr){ alert("날짜를 선택해주세요."); return; }
  const title = document.getElementById("eventTitle").value.trim();
  const color = document.getElementById("eventColor").value;

  if(!title){ alert("내용을 입력해주세요."); return; }

  if(db){
    db.collection("custom_events").doc(dateStr).set({ title, color, updatedAt: new Date() }).then(() => {
      alert(`[${dateStr}] 일정이 저장되었습니다.`);
      closeEventSection();
      if(calendar) calendar.refetchEvents();
    });
  }
}

function deleteCustomEvent(){
  const dateStr = document.getElementById("eventDate").value;
  if(!dateStr) return;
  if(confirm(`정말로 ${dateStr} 일정을 삭제하시겠습니까?`)){
    if(db){
      db.collection("custom_events").doc(dateStr).delete().then(() => {
        alert("삭제되었습니다.");
        closeEventSection();
        if(calendar) calendar.refetchEvents();
      });
    }
  }
}

async function openDateSim(dateStr){
  selectedDate = dateStr;
  document.getElementById("selectedDateText").innerText = dateStr;
  document.getElementById("simSection").classList.remove("hidden");
  
  resetMasterData();
  document.getElementById("teamsContainer").innerHTML = "";
  document.getElementById("simResult").classList.add("hidden");
  linkedReturnTeams = [];

  if (db) {
    try {
      const allDocs = await db.collection("schedules").get();
      allDocs.forEach(doc => {
        const regDate = doc.id;
        if (regDate !== dateStr) {
          const data = doc.data();
          if (data.teams && data.teams.length > 0) {
            data.teams.forEach(t => {
              const pattern = normalizePattern(t.pattern);
              const nights = parseInt(t.nights || 4, 10);
              const retDate = getReturnDate(regDate, nights);
              
              if (retDate === dateStr && pattern === 'ROUND') {
                linkedReturnTeams.push({
                  ...t,
                  regDate: regDate,
                  isReturnOnTarget: true
                });
              }
            });
          }
        }
      });
    } catch(e) { console.error("리턴 단체 조회 오류", e); }
  }

  if(db){
    db.collection("schedules").doc(dateStr).get().then((doc) => {
      if(doc.exists){
        const data = doc.data();
        if(data.masterRooms) masterRooms = data.masterRooms;
        initMasterRoomsUI();
        if(data.teams && data.teams.length > 0){
          data.teams.forEach(t => restoreTeamUI(t));
        } else { addTeam(); }
        runSimulation(false);
      } else {
        initMasterRoomsUI();
        addTeam();
        runSimulation(false);
      }
    }).catch(() => {
      initMasterRoomsUI();
      addTeam();
      runSimulation(false);
    });
  } else {
    initMasterRoomsUI();
    addTeam();
    runSimulation(false);
  }

  document.getElementById("simSection").scrollIntoView({ behavior: 'smooth' });
}

function updateMasterRoom(key){
  const totalVal = parseInt(document.getElementById(`master_room_${key}`).value, 10);
  const peopleVal = parseInt(document.getElementById(`master_gen_people_${key}`).value, 10);
  const capVal = parseInt(document.getElementById(`master_gen_cap_${key}`).value, 10);

  masterRooms[key].totalRooms = isNaN(totalVal) ? 0 : Math.max(0, totalVal);
  masterRooms[key].generalPeople = isNaN(peopleVal) ? "" : Math.max(0, peopleVal);
  masterRooms[key].generalCap = isNaN(capVal) ? "" : Math.max(0, capVal);

  const people = parseInt(masterRooms[key].generalPeople, 10) || 0;
  const cap = parseInt(masterRooms[key].generalCap, 10) || 0;
  const genRooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
  const remainRooms = Math.max(0, masterRooms[key].totalRooms - genRooms);

  document.getElementById(`calc_gen_room_${key}`).innerText = genRooms;
  document.getElementById(`calc_remain_room_${key}`).innerText = remainRooms;
}

function extractAllocations(typeDivs) {
  let totalPeople = 0;
  let allocations = [];
  typeDivs.forEach(td => {
    const key = td.querySelector(".typeSelect").value;
    const people = parseInt(td.querySelector(".assignPeople").value, 10) || 0;
    const cap = parseInt(td.querySelector(".capPerRoom").value, 10) || 1;

    if(people > 0){
      totalPeople += people;
      const roomsNeeded = Math.ceil(people / cap);
      allocations.push({ key, label: masterRooms[key].label, people, cap, roomsNeeded, totalRooms: masterRooms[key].totalRooms });
    }
  });
  return { totalPeople, allocations };
}

function runSimulation(shouldSave = true){
  const teamCards = [...document.querySelectorAll("#teamsContainer .team-card")];

  let todayTeams = [];
  let groupRoomUsed = { "6": 0, "4": 0, "2": 0, "dadami24": 0, "dadami36": 0 };
  let groupPeopleUsed = { "6": 0, "4": 0, "2": 0, "dadami24": 0, "dadami36": 0 };

  for (let idx = 0; idx < teamCards.length; idx++) {
    const card = teamCards[idx];
    const name = card.querySelector(".teamName").value.trim();
    const pattern = normalizePattern(card.querySelector(".teamPattern").value);
    const nights = parseInt(card.querySelector(".teamNights").value, 10) || 4;
    const price = card.querySelector(".teamPrice").value.trim();
    const memo = card.querySelector(".teamMemo").value.trim();
    const isSplitRoom = card.querySelector(".splitRoomCheck").checked;

    if (!name && !card.querySelector(".assignPeople")?.value) continue;

    let teamTotalPeople = 0;
    let allocations = [];
    let outAllocations = [];
    let inAllocations = [];

    if(!isSplitRoom) {
      const typeDivs = [...card.querySelectorAll(".normalRoomArea .type-card")];
      const res = extractAllocations(typeDivs);
      teamTotalPeople = res.totalPeople;
      allocations = res.allocations;

      if(teamTotalPeople <= 0 && shouldSave) {
        alert(`[${name || '단체'}] 단체의 배정 인원을 입력해주세요.`);
        card.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      
      if (pattern === 'ROUND' || pattern === 'ONEWAY_OUT') {
        allocations.forEach(a => {
          groupRoomUsed[a.key] += a.roomsNeeded;
          groupPeopleUsed[a.key] += a.people;
        });
      }

    } else {
      const outDivs = [...card.querySelectorAll(".splitRoomArea .outRoomTypesContainer .type-card")];
      const inDivs = [...card.querySelectorAll(".splitRoomArea .inRoomTypesContainer .type-card")];
      const outRes = extractAllocations(outDivs);
      const inRes = extractAllocations(inDivs);
      
      outAllocations = outRes.allocations;
      inAllocations = inRes.allocations;
      teamTotalPeople = Math.max(outRes.totalPeople, inRes.totalPeople);

      if((outRes.totalPeople <= 0 || inRes.totalPeople <= 0) && shouldSave) {
        alert(`[${name || '단체'}] 단체의 출국 및 입국 배정 인원을 모두 입력해주세요.`);
        card.scrollIntoView({ behavior: 'smooth' });
        return;
      }

      if (pattern === 'ROUND' || pattern === 'ONEWAY_OUT') {
        outAllocations.forEach(a => {
          groupRoomUsed[a.key] += a.roomsNeeded;
          groupPeopleUsed[a.key] += a.people;
        });
      }
    }

    const returnDate = getReturnDate(selectedDate, nights);
    const selShort = formatShortDate(selectedDate);
    const retShort = formatShortDate(returnDate);

    let itineraryStr = "";
    if(pattern === 'ROUND') {
      itineraryStr = `출국: ${selShort} ~ 리턴출국: ${retShort} (${nights}박)`;
    } else if(pattern === 'ONEWAY_OUT') {
      itineraryStr = `출국: ${selShort} (편도)`;
    } else {
      itineraryStr = `입국: ${selShort} (편도)`;
    }

    todayTeams.push({
      name: name || `단체 ${idx+1}`,
      pattern, nights, price, memo, isSplitRoom,
      totalPeople: teamTotalPeople,
      allocations, outAllocations, inAllocations,
      itineraryStr, returnDate,
      isReturnOnTarget: false
    });
  }

  /* 리턴 단체 사용 인원 및 객실 수량 합산 */
  linkedReturnTeams.forEach(t => {
    let targetAlloc = t.isSplitRoom ? (t.inAllocations || t.outAllocations || []) : (t.allocations || []);
    targetAlloc.forEach(a => {
      if(groupRoomUsed[a.key] !== undefined) {
        groupRoomUsed[a.key] += a.roomsNeeded;
        groupPeopleUsed[a.key] += a.people;
      }
    });
  });

  const todayOutTeams = todayTeams.filter(t => t.pattern === 'ROUND' || t.pattern === 'ONEWAY_OUT');
  const outBoardingTeams = [...todayOutTeams, ...linkedReturnTeams];

  const groupTotalPeople = outBoardingTeams.reduce((s,t) => s + t.totalPeople, 0);
  const groupTotalRooms = Object.values(groupRoomUsed).reduce((a,b)=>a+b, 0);

  let generalTotalPeople = 0;
  let generalRoomUsed = {};

  Object.keys(masterRooms).forEach(key => {
    const preset = masterRooms[key];
    const people = parseInt(preset.generalPeople, 10) || 0;
    const cap = parseInt(preset.generalCap, 10) || 0;
    const genRooms = (people > 0 && cap > 0) ? Math.ceil(people / cap) : 0;
    generalTotalPeople += people;
    generalRoomUsed[key] = genRooms;
  });

  const grandTotalPeople = generalTotalPeople + groupTotalPeople;

  /* 일반 객실 및 총 사용 객실 합계 계산 */
  const generalTotalRooms = Object.values(generalRoomUsed).reduce((a,b)=>a+b, 0);
  const grandTotalRooms = generalTotalRooms + groupTotalRooms;

  document.getElementById("simStats").innerHTML = `
    <div class="stat">출국 총 인원(예상)<b>${grandTotalPeople}명</b><span>일반 ${generalTotalPeople}명 + 단체 ${groupTotalPeople}명</span></div>
    <div class="stat">출국 단체 인원<b>총 ${groupTotalPeople}명</b><span>신규 ${todayOutTeams.length}개 + 리턴 ${linkedReturnTeams.length}개</span></div>
    <div class="stat">객실 사용량(예상)<b>총 ${grandTotalRooms}개</b><span>일반 ${generalTotalRooms}개 + 단체 ${groupTotalRooms}개</span></div>
  `;

  /* 헤더 순서 변경: 객실 종류 > 총 사용 객실 > 보유 대비 비중 > 단체 출국 승선 > 일반 여객 */
  let totalTypeHtml = `<thead><tr>
    <th>객실 종류</th>
    <th>총 사용 객실</th>
    <th>보유 대비 비중</th>
    <th>단체 출국 승선</th>
    <th>일반 여객</th>
  </tr></thead><tbody>`;
  let overLimit = false;

  Object.keys(masterRooms).forEach(key => {
    const preset = masterRooms[key];
    const total = preset.totalRooms;
    const genUsed = generalRoomUsed[key];
    const grpUsed = groupRoomUsed[key];
    const grpPeople = groupPeopleUsed[key];
    const totalUsed = genUsed + grpUsed;
    const genPeople = parseInt(preset.generalPeople, 10) || 0;
    
    let pctStr = "—";
    if(total > 0){
      const pct = (totalUsed / total * 100).toFixed(1);
      pctStr = `<b>${pct}%</b> (${totalUsed}/${total}개)`;
      if(totalUsed > total) overLimit = true;
    }

    const grpDisp = grpPeople > 0 ? `${grpPeople}명 (${grpUsed}개)` : "0개";
    const genDisp = genPeople > 0 ? `${genPeople}명 (${genUsed}개)` : "0개";

    totalTypeHtml += `<tr>
      <td><b>${preset.label}</b></td>
      <td class="${total > 0 && totalUsed > total ? 'bad' : ''}"><b>${totalUsed}개</b></td>
      <td>${pctStr}</td>
      <td>${grpDisp}</td>
      <td>${genDisp}</td>
    </tr>`;
  });
  totalTypeHtml += `</tbody>`;
  document.getElementById("totalTypeTable").innerHTML = totalTypeHtml;

  document.getElementById("simWarn").innerHTML = overLimit ? `<div class="warn-box"><span class="bad">⚠ 초과 경고:</span> 총 출국 객실 신청량이 보유 객실 수를 초과했습니다.</div>` : "";

  let teamResultsHtml = "";
  if (outBoardingTeams.length === 0) {
    teamResultsHtml = `<div style="text-align:center; padding:20px; color:#666;">오늘 출국 승선 예정인 단체가 없습니다.</div>`;
  } else {
    outBoardingTeams.forEach(team => {
      const priceText = team.price ? ` | 💵 ${esc(team.price)}` : '';
      let patternLabel = "🔄 왕복";
      if(team.pattern === 'ONEWAY_OUT') patternLabel = "➡️ 출국 편도";

      const isReturn = team.isReturnOnTarget;
      const statusTag = isReturn 
        ? `<span class="tag-linked">🔄 리턴 출국 (${formatShortDate(team.regDate)} 등록)</span>`
        : '';

      teamResultsHtml += `<div style="margin-bottom:16px; border-bottom:1px solid #e1e7ef; padding-bottom:12px;">
        <h3 style="margin-bottom:4px; color:#1769aa;">🚩 ${esc(team.name)} (${team.totalPeople}명) <span class="tag-pattern">${patternLabel}</span> ${statusTag}${priceText}</h3>
        <div style="font-size:13px; font-weight:bold; color:#2e7d32; margin-bottom:6px;">🗓️ 여정 정보: ${team.itineraryStr || (isReturn ? `리턴일: ${formatShortDate(selectedDate)} (원출발: ${formatShortDate(team.regDate)})` : '')}</div>
        ${team.memo ? `<div class="memo-box"><b>📌 메모:</b> ${esc(team.memo)}</div>` : ''}`;

      let targetAllocations = [];
      if (isReturn) {
        targetAllocations = team.isSplitRoom ? (team.inAllocations || team.outAllocations || []) : (team.allocations || []);
      } else {
        targetAllocations = team.isSplitRoom ? (team.outAllocations || []) : (team.allocations || []);
      }

      const teamTotalRooms = targetAllocations.reduce((s,a)=>s+(a.roomsNeeded||0), 0);
      
      teamResultsHtml += `<div class="table-responsive">
        <table>
          <thead><tr><th>객실 종류</th><th>인원</th><th>객실 당</th><th>필요 객실 (${teamTotalRooms}실)</th><th>보유 대비 비중</th></tr></thead>
          <tbody>`;
      targetAllocations.forEach(a => {
        const roomHoldPct = a.totalRooms > 0 ? (a.roomsNeeded / a.totalRooms * 100).toFixed(1) + `% (${a.roomsNeeded}/${a.totalRooms}개)` : "—";
        teamResultsHtml += `<tr>
          <td><b>${esc(a.label)}</b></td>
          <td>${a.people}명</td>
          <td>${a.cap}명/실</td>
          <td>${a.roomsNeeded}개</td>
          <td><b>${roomHoldPct}</b></td>
        </tr>`;
      });
      teamResultsHtml += `</tbody></table></div></div>`;
    });
  }

  document.getElementById("teamResultsContainer").innerHTML = teamResultsHtml;
  document.getElementById("simResult").classList.remove("hidden");

  if(shouldSave && db && selectedDate){
    db.collection("schedules").doc(selectedDate).set({
      totalPeople: grandTotalPeople,
      groupTotalPeople: groupTotalPeople,
      teamCount: todayTeams.length,
      masterRooms: masterRooms,
      teams: todayTeams,
      updatedAt: new Date()
    }).then(() => {
      alert(`[${selectedDate}] 일정 정보가 저장되었습니다.`);
      if(calendar) calendar.refetchEvents();
    }).catch(err => { alert("저장 실패: " + err); });
  }
}

function deleteDateData(){
  if(!selectedDate) return;
  if(confirm(`정말로 ${selectedDate} 날짜의 데이터를 삭제하시겠습니까?`)){
    if(db){
      db.collection("schedules").doc(selectedDate).delete().then(() => {
        alert("삭제되었습니다.");
        closeSimSection();
        if(calendar) calendar.refetchEvents();
      });
    }
  }
}

const WEEKDAYS_KR = ['일','월','화','수','목','금','토'];

function formatDateMDShort(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr);
  const mm = d.getMonth() + 1;
  const dd = d.getDate();
  const wd = WEEKDAYS_KR[d.getDay()];
  return `${mm}-${dd}(${wd})`;
}

async function downloadMonthlyExcel(year, month){
  if(!db){ alert("데이터베이스 연결이 없습니다."); return; }

  const mm = String(month).padStart(2, '0');
  const lastDay = new Date(year, month, 0).getDate();

  const today = new Date();
  const todayStr = `${today.getMonth() + 1}/${today.getDate()}`;
  const titleText = `${year}년 ${month}월 (${todayStr} 기준)`;

  function formatGroupNames(namesArray) {
    if (!namesArray || namesArray.length === 0) return "";
    let lines = [];
    for (let i = 0; i < namesArray.length; i += 3) {
      const chunk = namesArray.slice(i, i + 3);
      lines.push(chunk.join(", "));
    }
    return lines.join("<br>");
  }

  try {
    const querySnapshot = await db.collection("schedules").get();
    let outGroups = {}; 

    querySnapshot.forEach(doc => {
      const regDate = doc.id;
      const data = doc.data();
      if(!data.teams || data.teams.length === 0) return;

      data.teams.forEach(t => {
        const name = t.name || "";
        const people = parseInt(t.totalPeople || 0, 10);
        const nights = parseInt(t.nights || 4, 10);
        const pattern = normalizePattern(t.pattern);
        const returnDate = getReturnDate(regDate, nights);

        if(pattern === 'ROUND'){
          [regDate, returnDate].forEach(d => {
            if(!outGroups[d]) outGroups[d] = { names: [], total: 0 };
            outGroups[d].names.push(`${name} ${people}명`);
            outGroups[d].total += people;
          });
        } else if(pattern === 'ONEWAY_OUT' || pattern === 'ONEWAY_IN'){
          if(!outGroups[regDate]) outGroups[regDate] = { names: [], total: 0 };
          outGroups[regDate].names.push(`${name} ${people}명`);
          outGroups[regDate].total += people;
        }
      });
    });

    let leftDates = [];  
    let rightDates = []; 

    for (let day = 1; day <= lastDay; day++) {
      const curDateStr = `${year}-${mm}-${String(day).padStart(2, '0')}`;
      const dow = new Date(curDateStr).getDay();

      if (dow === 1 || dow === 3 || dow === 5) {
        leftDates.push(curDateStr);
      } else if (dow === 2 || dow === 4 || dow === 0) {
        rightDates.push(curDateStr);
      }
    }

    const maxRows = Math.max(leftDates.length, rightDates.length);
    const cellStyle = "border:1px solid #000000; vertical-align:middle; valig:middle;";

    let tableHtml = `<table border="1" style="border-collapse:collapse; text-align:center; font-family:맑은 고딕, Arial;">`;
    
    tableHtml += `
      <tr>
        <th colspan="6" style="${cellStyle} font-size:16px; font-weight:bold; background-color:#e2efda; height:40px;">
          ${titleText} 단체 운항 현황
        </th>
      </tr>
      <tr style="background-color:#f2f2f2; font-weight:bold; height:32px;">
        <th style="${cellStyle} width:90px;">날짜</th>
        <th style="${cellStyle} width:320px;">한국출발, 중국리턴단체</th>
        <th style="${cellStyle} width:70px;">총인원</th>
        <th style="${cellStyle} width:90px;">날짜</th>
        <th style="${cellStyle} width:320px;">한국리턴, 중국출발단체</th>
        <th style="${cellStyle} width:70px;">총인원</th>
      </tr>
    `;

    for (let i = 0; i < maxRows; i++) {
      const lDate = leftDates[i] || "";
      const rDate = rightDates[i] || "";

      const lDateDisp = lDate ? formatDateMDShort(lDate) : "";
      const lNamesDisp = (lDate && outGroups[lDate]) ? formatGroupNames(outGroups[lDate].names) : "";
      const lTotalDisp = (lDate && outGroups[lDate]) ? outGroups[lDate].total : "";

      const rDateDisp = rDate ? formatDateMDShort(rDate) : "";
      const rNamesDisp = (rDate && outGroups[rDate]) ? formatGroupNames(outGroups[rDate].names) : "";
      const rTotalDisp = (rDate && outGroups[rDate]) ? outGroups[rDate].total : "";

      tableHtml += `
        <tr>
          <td style="${cellStyle} text-align:center; padding:5px;">${lDateDisp}</td>
          <td style="${cellStyle} text-align:left; padding:5px 8px; white-space:pre-line;">${lNamesDisp}</td>
          <td style="${cellStyle} text-align:right; padding:5px 8px;">${lTotalDisp}</td>

          <td style="${cellStyle} text-align:center; padding:5px;">${rDateDisp}</td>
          <td style="${cellStyle} text-align:left; padding:5px 8px; white-space:pre-line;">${rNamesDisp}</td>
          <td style="${cellStyle} text-align:right; padding:5px 8px;">${rTotalDisp}</td>
        </tr>
      `;
    }

    tableHtml += `
      <tr>
        <td colspan="6" style="${cellStyle} text-align:left; font-size:11px; color:#d32f2f; font-weight:bold; height:30px; padding-left:8px;">
          * 위 예약상황은 모객 중이므로 인원이 변동될 수 있습니다. (토요일 휴항 제외)
        </td>
      </tr>
    </table>`;

    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = tableHtml;
    const tableEl = tempDiv.querySelector("table");

    const wb = XLSX.utils.table_to_book(tableEl, { sheet: "월별단체현황" });
    const ws = wb.Sheets["월별단체현황"];
    ws['!cols'] = [
      { wch: 13 }, { wch: 45 }, { wch: 10 },
      { wch: 13 }, { wch: 45 }, { wch: 10 }
    ];

    XLSX.writeFile(wb, `단동훼리_${year}년${mm}월_단체운항현황.xlsx`);

  } catch(e) {
    console.error(e);
    alert("다운로드 중 오류가 발생했습니다: " + e.message);
  }
}
