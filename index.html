/* =========================================================

let selectedDate = "";

/* =========================================================
   공통 함수
========================================================= */

function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/*
 * 날짜 + 일수
 *
 * 왕복:
 * 출발일 + 박수 = 다음 출국일
 *
 * 예:
 * 월요일 + 4박 = 금요일?
 *
 * 정확히는 숙박일수 기준이므로
 * 월 출발
 * 월→화 1박
 * 화→수 2박
 * 수→목 3박
 * 목→금 4박
 *
 * 따라서 4박이면 금요일 출국.
 *
 * 사용자가 요청한 "월요일 출발 4박 5일이면 목요일에 다시 출국"을
 * 반영하기 위해 아래 계산에서는 "여정 일수 기준"을 사용합니다.
 *
 * 즉 4박 5일 → 출발 후 4일이 아니라 3일 뒤 출국.
 */

function addDays(dateStr, days){

  const result = new Date(dateStr + "T00:00:00");

  result.setDate(
    result.getDate() + parseInt(days,10)
  );

  return result.toISOString().split("T")[0];

}


/*
 * 왕복의 두 번째 출국일
 *
 * 선박 일정은 출국일과 실제 도착일 사이에
 * 여정이 끝나는 날이 있고, 달력에는 실제 재출항일을 표시한다.
 * 예: 3박 4일 → 3일 뒤 도착, 2일 뒤 재출국
 * 따라서 재출국일 = 출발일 + (박수 - 1)
 */
function getReturnDate(dateStr, nights){

  const n = parseInt(nights,10) || 1;

  return addDays(
    dateStr,
    Math.max(1,n - 1)
  );

}


function formatShortDate(dateStr){

  if(!dateStr || dateStr.length < 10){
    return dateStr;
  }

  return dateStr.substring(5);

}


/*
 * 기존 데이터 호환
 *
 * KR_ROUND
 * CN_ROUND
 * ROUND
 *
 * 전부 왕복으로 취급
 */
function normalizePattern(pattern){

  if(
    pattern === "KR_ROUND" ||
    pattern === "CN_ROUND" ||
    pattern === "ROUND"
  ){

    return "ROUND";

  }

  return pattern || "ROUND";

}


/* =========================================================
   객실 영역 접기
========================================================= */

function toggleMasterArea(){

  const content =
    document.getElementById("masterAreaContent");

  const icon =
    document.getElementById("masterToggleIcon");

  if(content.classList.contains("hidden")){

    content.classList.remove("hidden");
    icon.innerText = "▲ 접기";

  }else{

    content.classList.add("hidden");
    icon.innerText = "▼ 열기";

  }

}


/* =========================================================
   달력
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const calendarEl =
      document.getElementById("calendar");

    calendar =
      new FullCalendar.Calendar(
        calendarEl,
        {

          initialView:"dayGridMonth",

          locale:"ko",

          headerToolbar:{
            left:"prev,next today",
            center:"title",
            right:""
          },


          dateClick:function(info){

            closeEventSection();

            openDateSim(info.dateStr);

          },


          eventSources:[

            /* =========================
               대한민국 공휴일
            ========================== */

            {

              events:async function(
                fetchInfo,
                successCallback
              ){

                try{

                  const year =
                    fetchInfo.start.getFullYear();

                  const res =
                    await fetch(
                      `https://date.nager.at/api/v3/PublicHolidays/${year}/KR`
                    );

                  const holidays =
                    await res.json();

                  successCallback(

                    holidays.map(h => ({

                      title:`🔴 ${h.localName}`,

                      start:h.date,

                      allDay:true,

                      backgroundColor:"#fff0f0",

                      borderColor:"#f3c2c2",

                      textColor:"#d32f2f"

                    }))

                  );

                }catch(e){

                  successCallback([]);

                }

              }

            },


            /* =========================
               단체 일정
               
               모든 왕복은
               출국 → 출국
               
               따라서 양쪽 날짜 모두
               "출국"으로 표시
            ========================== */

            {

              events:function(
                fetchInfo,
                successCallback
              ){

                if(!db){

                  successCallback([]);

                  return;

                }

                db.collection("schedules")
                  .get()
                  .then(querySnapshot => {

                    const dailyDeparture = {};


                    querySnapshot.forEach(doc => {

                      const regDate = doc.id;

                      const data = doc.data();


                      if(
                        !data.teams ||
                        data.teams.length === 0
                      ){

                        return;

                      }


                      data.teams.forEach(t => {

                        const p =
                          parseInt(
                            t.totalPeople,
                            10
                          ) || 0;

                        if(p <= 0) return;


                        const pattern =
                          normalizePattern(
                            t.pattern
                          );


                        /*
                         * 현재 등록일 = 출국
                         */

                        if(
                          pattern === "ROUND" ||
                          pattern === "ONEWAY_OUT"
                        ){

                          dailyDeparture[regDate] =
                            (dailyDeparture[regDate] || 0)
                            + p;

                        }


                        /*
                         * 왕복이면
                         * 다음 출국일에도 출국
                         */

                        if(pattern === "ROUND"){

                          const nights =
                            parseInt(
                              t.nights || 4,
                              10
                            );

                          const returnDate =
                            getReturnDate(
                              regDate,
                              nights
                            );

                          dailyDeparture[returnDate] =
                            (dailyDeparture[returnDate] || 0)
                            + p;

                        }

                      });

                    });


                    const events = [];


                    Object.keys(dailyDeparture)
                      .forEach(d => {

                        if(
                          dailyDeparture[d] > 0
                        ){

                          events.push({

                            title:
                              `출${dailyDeparture[d]}`,

                            start:d,

                            color:"#1769aa"

                          });

                        }

                      });


                    successCallback(events);

                  })
                  .catch(() => {

                    successCallback([]);

                  });

              }

            },


            /* =========================
               휴항 / 메모
            ========================== */

            {

              events:function(
                fetchInfo,
                successCallback
              ){

                if(!db){

                  successCallback([]);

                  return;

                }

                db.collection("custom_events")
                  .get()
                  .then(querySnapshot => {

                    const events = [];


                    querySnapshot.forEach(doc => {

                      const data = doc.data();

                      events.push({

                        id:"ce_" + doc.id,

                        title:
                          data.type === "✏️ 메모"
                            ? (
                                data.title
                                  ? `✏️ ${data.title}`
                                  : "✏️ 메모"
                              )
                            : (
                                `${data.type} ${
                                  data.title
                                    ? "- " + data.title
                                    : ""
                                }`
                              ),

                        start:doc.id,

                        color:
                          data.color ||
                          "#d32f2f"

                      });

                    });


                    successCallback(events);

                  })
                  .catch(() => {

                    successCallback([]);

                  });

              }

            }

          ]

        }
      );


    calendar.render();

  }
);

========================================================= */

async function openDateSim(dateStr){

  selectedDate = dateStr;

  document.getElementById(
    "selectedDateText"
  ).innerText = dateStr;

  document
    .getElementById("simSection")
    .classList.remove("hidden");


  resetMasterData();

  document.getElementById(
    "teamsContainer"
  ).innerHTML = "";

  document.getElementById(
    "simResult"
  ).classList.add("hidden");


  linkedReturnTeams = [];


  /*
   * 과거 날짜에서
   * 오늘 다시 출국하는 왕복 단체 찾기
   */

  if(db){

    try{

      const allDocs =
        await db.collection("schedules").get();


      allDocs.forEach(doc => {

        const regDate = doc.id;


        if(regDate === dateStr){
          return;
        }


        const data = doc.data();


        if(
          !data.teams ||
          data.teams.length === 0
        ){

          return;

        }


        data.teams.forEach(t => {

          const pattern =
            normalizePattern(t.pattern);


          if(pattern !== "ROUND"){
            return;
          }


          const nights =
            parseInt(
              t.nights || 4,
              10
            );


          const retDate =
            getReturnDate(
              regDate,
              nights
            );


          if(retDate === dateStr){

            linkedReturnTeams.push({

              ...t,

              pattern:"ROUND",

              regDate,

              isReturnOnTarget:true

            });

          }

        });

      });


    }catch(e){

      console.error(
        "왕복 복귀 출국 단체 조회 오류",
        e
      );

    }

  }


  /* =========================
     현재 날짜 데이터 불러오기
  ========================== */

  if(db){

    db.collection("schedules")
      .doc(dateStr)
      .get()
      .then(doc => {

        if(doc.exists){

          const data = doc.data();


          if(data.masterRooms){

            masterRooms =
              data.masterRooms;

          }


          initMasterRoomsUI();


          if(
            data.teams &&
            data.teams.length > 0
          ){

            data.teams.forEach(t => {

              restoreTeamUI(t);

            });

          }else{

            addTeam();

          }


          runSimulation(false);


        }else{

          initMasterRoomsUI();

          addTeam();

        }

      })
      .catch(() => {

        initMasterRoomsUI();

        addTeam();

      });


  }else{

    initMasterRoomsUI();

    addTeam();

  }


  document
    .getElementById("simSection")
    .scrollIntoView({
      behavior:"smooth"
    });

}

  document

    .classList.add("hidden");

}

function updateMasterRoom(key){

  const totalVal =
    parseInt(
      document.getElementById(
        `master_room_${key}`
      ).value,
      10
    );


  const peopleVal =
    parseInt(
      document.getElementById(
        `master_gen_people_${key}`
      ).value,
      10
    );


  const capVal =
    parseInt(
      document.getElementById(
        `master_gen_cap_${key}`
      ).value,
      10
    );


  masterRooms[key].totalRooms =
    isNaN(totalVal)
      ? 0
      : Math.max(0,totalVal);


  masterRooms[key].generalPeople =
    isNaN(peopleVal)
      ? ""
      : Math.max(0,peopleVal);


  masterRooms[key].generalCap =
    isNaN(capVal)
      ? ""
      : Math.max(0,capVal);


  const people =
    parseInt(
      masterRooms[key].generalPeople,
      10
    ) || 0;


  const cap =
    parseInt(
      masterRooms[key].generalCap,
      10
    ) || 0;


  const genRooms =
    (
      people > 0 &&
      cap > 0
    )
      ? Math.ceil(people / cap)
      : 0;


  const remainRooms =
    Math.max(
      0,
      masterRooms[key].totalRooms - genRooms
    );


  document.getElementById(
    `calc_gen_room_${key}`
  ).innerText = genRooms;


  document.getElementById(
    `calc_remain_room_${key}`
  ).innerText = remainRooms;

}

/* =========================================================

function toggleRoomSplitUI(teamId){

  const card =
    document.getElementById(teamId);


  const isChecked =
    card.querySelector(
      ".splitRoomCheck"
    ).checked;


  const normalArea =
    card.querySelector(
      ".normalRoomArea"
    );


  const splitArea =
    card.querySelector(
      ".splitRoomArea"
    );


  if(isChecked){

    normalArea.classList.add(
      "hidden"
    );

    splitArea.classList.remove(
      "hidden"
    );


    const outContainer =
      card.querySelector(
        ".outRoomTypesContainer"
      );


    const inContainer =
      card.querySelector(
        ".inRoomTypesContainer"
      );


    const normalDivs =
      [
        ...card.querySelectorAll(
          ".roomTypesContainer .type-card"
        )
      ];


    if(
      normalDivs.length > 0 &&
      !outContainer.children.length
    ){

      outContainer.innerHTML = "";


      normalDivs.forEach(td => {

        const key =
          td.querySelector(
            ".typeSelect"
          ).value;

        const people =
          td.querySelector(
            ".assignPeople"
          ).value;

        const cap =
          td.querySelector(
            ".capPerRoom"
          ).value;


        addRoomTypeToTeam(
          teamId,
          "outRoomTypesContainer",
          key,
          people,
          cap
        );

    }else if(
      !outContainer.children.length
    ){

      addRoomTypeToTeam(
        teamId,
        "outRoomTypesContainer",
        "6",
        "",
        4
      );

    }


    /*
     * 재출국 객실은
     * 기본적으로 출국 객실 설정을 복사
     */

    inContainer.innerHTML = "";


    const outDivs =
      [
        ...outContainer.querySelectorAll(
          ".type-card"
        )
      ];


    outDivs.forEach(td => {

      const key =
        td.querySelector(
          ".typeSelect"
        ).value;

      const people =
        td.querySelector(
          ".assignPeople"
        ).value;

      const cap =
        td.querySelector(
          ".capPerRoom"
        ).value;


      addRoomTypeToTeam(
        teamId,
        "inRoomTypesContainer",
        key,
        people,
        cap
      );

    });


  }else{

    normalArea.classList.remove(
      "hidden"
    );

    splitArea.classList.add(
      "hidden"
    );


    if(
      !card.querySelector(
        ".roomTypesContainer"
      ).children.length
    ){

      addRoomTypeToTeam(
        teamId,
        "roomTypesContainer",
        "6",
        "",
        4

      class="normalRoomArea ${isSplit ? "hidden" : ""}">

      <div class="roomTypesContainer"></div>

      <button
        class="secondary"
        type="button"
        style="font-size:12px;padding:4px 8px;margin-top:4px;"
        onclick="addRoomTypeToTeam('${teamId}','roomTypesContainer')">

        + 객실 추가

      </button>

    </div>


    <div
      class="splitRoomArea ${isSplit ? "" : "hidden"}">

      <div class="section-subtitle">
        출국 시 객실 설정
      </div>

      <div class="outRoomTypesContainer"></div>

      <button
        class="secondary"
        type="button"
        style="font-size:12px;padding:4px 8px;margin-top:4px;"
        onclick="addRoomTypeToTeam('${teamId}','outRoomTypesContainer')">

        + 출국 객실 추가

      </button>


      <div
        class="section-subtitle"
        style="margin-top:12px;">

        재출국 시 객실 설정

      </div>

      <div class="inRoomTypesContainer"></div>

      <button
        class="secondary"
        type="button"
        style="font-size:12px;padding:4px 8px;margin-top:4px;"
        onclick="addRoomTypeToTeam('${teamId}','inRoomTypesContainer')">

        + 재출국 객실 추가

      </button>

    </div>

  `;


  document
    .getElementById("teamsContainer")
    .appendChild(teamDiv);


  if(!isSplit){

    if(teamData.allocations){

      teamData.allocations.forEach(a => {

        addRoomTypeToTeam(
          teamId,
          "roomTypesContainer",
          a.key,
          a.people,
          a.cap
        );

      });

    }

  }else{

    if(teamData.outAllocations){

      teamData.outAllocations.forEach(a => {

        addRoomTypeToTeam(
          teamId,
          "outRoomTypesContainer",
          a.key,
          a.people,
          a.cap
        );

      });

    }


    if(teamData.inAllocations){

      teamData.inAllocations.forEach(a => {

        addRoomTypeToTeam(
          teamId,
          "inRoomTypesContainer",
          a.key,
          a.people,
          a.cap
        );

      });

    }

  }

}


/* =========================================================
   객실 종류 추가
========================================================= */

function addRoomTypeToTeam(
  teamId,
  containerClass,
  presetKey="6",
  assignPeople="",
  capPerRoom=""
){

  const container =
    document
      .getElementById(teamId)
      .querySelector("." + containerClass);


  const typeId =
    teamId +
    "_type_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 1000
    );


  const preset =
    masterRooms[presetKey];


  const cap =
    capPerRoom ||
    preset.defaultCapPerRoom;


  const div =
    document.createElement("div");


  div.className =
    "type-card";

  div.id =
    typeId;


  div.innerHTML = `

    <div class="type-grid">

      <div>

        <label>객실 종류</label>

        <select class="typeSelect">

          <option value="6">6인실</option>

          <option value="4">4인실</option>

          <option value="2">2인실</option>

          <option value="dadami24">
            다다미 24인실
          </option>

          <option value="dadami36">
            다다미 36인실
          </option>

        </select>

      </div>


      <div>

        <label
          style="color:#0d47a1;font-weight:bold;">
          배정 인원(명)
        </label>

        <input
          type="number"
          class="assignPeople"
          min="1"
          value="${assignPeople}">

      </div>


      <div>

        <label>객실당 인원</label>

        <input
          type="number"
          class="capPerRoom"
          min="1"
          value="${cap}">

      </div>


      <div
        style="text-align:right;margin-top:16px;">

        <button
          class="danger"
          type="button"
          style="padding:6px 8px;"
          onclick="document.getElementById('${typeId}').remove()">

          ✕

        </button>

      </div>

    </div>

  `;


  container.appendChild(div);


  div.querySelector(
    ".typeSelect"
  ).value = presetKey;

}


/* =========================================================
   객실 배정 추출
========================================================= */

function extractAllocations(typeDivs){

  let totalPeople = 0;

  let allocations = [];


  typeDivs.forEach(td => {

    const key =
      td.querySelector(
        ".typeSelect"
      ).value;


    const people =
      parseInt(
        td.querySelector(
          ".assignPeople"
        ).value,
        10
      ) || 0;


    const cap =
      parseInt(
        td.querySelector(
          ".capPerRoom"
        ).value,
        10
      ) || 1;


    if(people > 0){

      totalPeople += people;


      const roomsNeeded =
        Math.ceil(
          people / cap
        );


      allocations.push({

        key,

        label:
          masterRooms[key].label,

        people,

        cap,

        roomsNeeded,

        totalRooms:
          masterRooms[key].totalRooms

      });

    }

  });


  return {
    totalPeople,
    allocations
  };

}


/* =========================================================
   메인 계산
========================================================= */

function runSimulation(
  shouldSave=true
){

  const teamCards =
    [
      ...document.querySelectorAll(
        "#teamsContainer .team-card"
      )
    ];


  let todayTeams = [];


  let groupRoomUsed = {

    "6":0,

    "4":0,

    "2":0,

    "dadami24":0,

    "dadami36":0

  };


  /*
   * 현재 날짜에 새로 등록된 단체
   */

  for(
    let idx=0;
    idx<teamCards.length;
    idx++
  ){

    const card =
      teamCards[idx];


    const name =
      card.querySelector(
        ".teamName"
      ).value.trim()
      ||
      `단체 ${idx+1}`;


    const pattern =
      normalizePattern(
        card.querySelector(
          ".teamPattern"
        ).value
      );


    const nights =
      parseInt(
        card.querySelector(
          ".teamNights"
        ).value,
        10
      ) || 4;


    const price =
      card.querySelector(
        ".teamPrice"
      ).value.trim();


    const memo =
      card.querySelector(
        ".teamMemo"
      ).value.trim();


    const isSplitRoom =
      card.querySelector(
        ".splitRoomCheck"
      ).checked;


    let teamTotalPeople = 0;

    let allocations = [];

    let outAllocations = [];

    let inAllocations = [];


    /* =========================
       일반 객실
    ========================== */

    if(!isSplitRoom){

      const typeDivs =
        [
          ...card.querySelectorAll(
            ".normalRoomArea .type-card"
          )
        ];


      const res =
        extractAllocations(
          typeDivs
        );


      teamTotalPeople =
        res.totalPeople;

      allocations =
        res.allocations;


      if(
        teamTotalPeople <= 0 &&
        shouldSave
      ){

        alert(
          `[${name}] 단체의 배정 인원을 입력해주세요.`
        );

        card.scrollIntoView({
          behavior:"smooth"
        });

        return;

      }


      /*
       * 현재 날짜가 출국이면
       * 객실 사용량 반영
       */

      if(
        pattern === "ROUND" ||
        pattern === "ONEWAY_OUT"
      ){

        allocations.forEach(a => {

          groupRoomUsed[a.key] +=
            a.roomsNeeded;

        });

      }

    }else{

      /* =========================
         분리 객실
      ========================== */

      const outDivs =
        [
          ...card.querySelectorAll(
            ".splitRoomArea .outRoomTypesContainer .type-card"
          )
        ];


      const inDivs =
        [
          ...card.querySelectorAll(
            ".splitRoomArea .inRoomTypesContainer .type-card"
          )
        ];


      const outRes =
        extractAllocations(
          outDivs
        );


      const inRes =
        extractAllocations(
          inDivs
        );


      outAllocations =
        outRes.allocations;


      inAllocations =
        inRes.allocations;


      teamTotalPeople =
        Math.max(
          outRes.totalPeople,
          inRes.totalPeople
        );


      if(
        pattern === "ROUND" &&
        (
          outRes.totalPeople <= 0 ||
          inRes.totalPeople <= 0
        ) &&
        shouldSave
      ){

        alert(
          `[${name}] 왕복 단체는 출국 및 재출국 배정 인원을 모두 입력해주세요.`
        );

        card.scrollIntoView({
          behavior:"smooth"
        });

        return;

      }


      if(
        pattern === "ONEWAY_OUT" &&
        outRes.totalPeople <= 0 &&
        shouldSave
      ){

        alert(
          `[${name}] 출국 배정 인원을 입력해주세요.`
        );

        card.scrollIntoView({
          behavior:"smooth"
        });

        return;

      }


      /*
       * 신규 등록일은 출국이므로
       * OUT 객실 사용
       */

      if(
        pattern === "ROUND" ||
        pattern === "ONEWAY_OUT"
      ){

        outAllocations.forEach(a => {

          groupRoomUsed[a.key] +=
            a.roomsNeeded;

        });

      }

    }


    const days =
      pattern === "ROUND"
        ? nights + 1
        : 1;


    /*
     * 왕복:
     * 사용자가 요청한 기준
     *
     * 4박 5일 → 3일 뒤 출국
     */

    const returnDate =
      pattern === "ROUND"
        ? getReturnDate(
            selectedDate,
            nights
          )
        : "";


    const selShort =
      formatShortDate(
        selectedDate
      );


    const retShort =
      formatShortDate(
        returnDate
      );


    let itineraryStr = "";


    if(pattern === "ROUND"){

      itineraryStr =
        `출국: ${selShort} → 출국: ${retShort} (${nights}박 ${days}일)`;

    }else if(
      pattern === "ONEWAY_OUT"
    ){

      itineraryStr =
        `출국: ${selShort} (편도)`;

    }else{

      itineraryStr =
        `입국: ${selShort} (편도)`;

    }


    todayTeams.push({

      name,

      pattern,

      nights,

      price,

      memo,

      isSplitRoom,

      totalPeople:
        teamTotalPeople,

      allocations,

      outAllocations,

      inAllocations,

      itineraryStr,

      returnDate,

      isReturnOnTarget:false

    });

  }


  /* =========================================================
     과거 날짜에서 넘어온 "재출국" 단체
  ========================================================= */

  let linkedReturnOutTeams = [];


  linkedReturnTeams.forEach(t => {

    if(
      normalizePattern(
        t.pattern
      ) !== "ROUND"
    ){

      return;

    }


    linkedReturnOutTeams.push(t);


    /*
     * 일반 객실:
     * 동일 객실 사용
     *
     * 분리 객실:
     * 재출국(inAllocations) 사용
     */

    let targetAlloc = [];


    if(t.isSplitRoom){

      targetAlloc =
        t.inAllocations || [];

    }else{

      targetAlloc =
        t.allocations || [];

    }


    targetAlloc.forEach(a => {

      if(
        groupRoomUsed[a.key] !== undefined
      ){

        groupRoomUsed[a.key] +=
          a.roomsNeeded;

      }

    });

  });


  /*
   * 오늘 출국하는 단체
   *
   * 1. 오늘 신규 출국
   * 2. 과거 왕복 단체의 재출국
   */

  const todayOutTeams =
    todayTeams.filter(t =>
      t.pattern === "ROUND" ||
      t.pattern === "ONEWAY_OUT"
    );


  const outBoardingTeams =
    [
      ...todayOutTeams,
      ...linkedReturnOutTeams
    ];


  const groupTotalPeople =
    outBoardingTeams.reduce(
      (s,t) =>
        s + (parseInt(t.totalPeople,10) || 0),
      0
    );


  const groupTotalRooms =
    Object.values(
      groupRoomUsed
    ).reduce(
      (a,b) => a+b,
      0
    );


  /* =========================================================
     일반 여객
  ========================================================= */

  let generalTotalPeople = 0;

  let generalRoomUsed = {};


  Object.keys(masterRooms)
    .forEach(key => {

      const preset =
        masterRooms[key];


      const people =
        parseInt(
          preset.generalPeople,
          10
        ) || 0;


      const cap =
        parseInt(
          preset.generalCap,
          10
        ) || 0;


      const genRooms =
        (
          people > 0 &&
          cap > 0
        )
          ? Math.ceil(
              people / cap
            )
          : 0;


      generalTotalPeople +=
        people;


      generalRoomUsed[key] =
        genRooms;

    });


  const grandTotalPeople =
    generalTotalPeople +
    groupTotalPeople;


  /* =========================================================
     상단 통계
  ========================================================= */

  document.getElementById(
    "simStats"
  ).innerHTML = `

    <div class="stat">

      출국 승선 인원

      <b>
        ${grandTotalPeople}명
      </b>

      <span>
        일반 ${generalTotalPeople}명
        +
        단체 ${groupTotalPeople}명
      </span>

    </div>


    <div class="stat">

      출국 승선 단체 수

      <b>
        ${outBoardingTeams.length}개 단체
      </b>

      <span>
        신규 ${todayOutTeams.length}
        +
        재출국 ${linkedReturnOutTeams.length}
      </span>

    </div>


    <div class="stat">

      출국 승선 객실

      <b>
        ${groupTotalRooms}개
      </b>

      <span>
        출국 단체 객실 합계
      </span>

    </div>

  `;


  /* =========================================================
     객실 사용统计
  ========================================================= */

  let totalTypeHtml = `

    <thead>

      <tr>

        <th>객실 종류</th>

        <th>전체 보유 수</th>

        <th>일반 여객</th>

        <th>단체 출국 승선</th>

        <th>총 사용 객실</th>

        <th>보유 대비 비중</th>

      </tr>

    </thead>

    <tbody>

  `;


  let overLimit = false;


  Object.keys(masterRooms)
    .forEach(key => {

      const preset =
        masterRooms[key];


      const total =
        preset.totalRooms;


      const genUsed =
        generalRoomUsed[key];


      const grpUsed =
        groupRoomUsed[key];


      const totalUsed =
        genUsed + grpUsed;


      const genPeople =
        parseInt(
          preset.generalPeople,
          10
        ) || 0;


      let pctStr = "—";


      if(total > 0){

        const pct =
          (
            totalUsed /
            total *
            100
          ).toFixed(1);


        pctStr =
          `<b>${pct}%</b> (${totalUsed}/${total}개)`;


        if(
          totalUsed > total
        ){

          overLimit = true;

        }

      }


      totalTypeHtml += `

        <tr>

          <td>
            <b>${preset.label}</b>
          </td>

          <td>
            ${total > 0
              ? total + "개"
              : "무제한"}
          </td>

          <td>
            ${
              genPeople > 0
                ? `${genPeople}명 (${genUsed}개)`
                : "0개"
            }
          </td>

          <td>
            ${grpUsed}개
          </td>

          <td
            class="${
              total > 0 &&
              totalUsed > total
                ? "bad"
                : ""
            }">

            <b>
              ${totalUsed}개
            </b>

          </td>

          <td>
            ${pctStr}
          </td>

        </tr>

      `;

    });


  totalTypeHtml += `
    </tbody>
  `;


  document.getElementById(
    "totalTypeTable"
  ).innerHTML =
    totalTypeHtml;


  document.getElementById(
    "simWarn"
  ).innerHTML =
    overLimit
      ? `
        <div class="warn-box">

          <span class="bad">
            ⚠ 초과 경고:
          </span>

          총 출국 객실 신청량이
          보유 객실 수를 초과했습니다.

        </div>
      `
      : "";


  /* =========================================================
     단체 상세
  ========================================================= */

  let teamResultsHtml = "";


  if(
    outBoardingTeams.length === 0
  ){

    teamResultsHtml = `

      <div
        style="
          text-align:center;
          padding:20px;
          color:#666;
        ">

        오늘 출국 승선 예정인
        단체가 없습니다.

      </div>

    `;

  }else{

    outBoardingTeams.forEach(team => {

      const priceText =
        team.price
          ? ` | 💵 ${esc(team.price)}`
          : "";


      let patternLabel =
        "🔄 왕복 (출국 → 출국)";


      if(
        team.pattern ===
        "ONEWAY_OUT"
      ){

        patternLabel =
          "➡️ 출국 편도";

      }


      const isReturn =
        team.isReturnOnTarget;


      const statusTag =
        isReturn
          ? `
            <span class="tag-linked">

              🔄 재출국
              (${formatShortDate(team.regDate)} 등록)

            </span>
          `
          : "";


      teamResultsHtml += `

        <div
          style="
            margin-bottom:16px;
            border-bottom:1px solid #e1e7ef;
            padding-bottom:12px;
          ">

          <h3
            style="
              margin-bottom:4px;
              color:#1769aa;
            ">

            🚩 ${esc(team.name)}
            (${team.totalPeople}명)

            <span class="tag-pattern">
              ${patternLabel}
            </span>

            ${statusTag}

            ${priceText}

          </h3>


          <div
            style="
              font-size:13px;
              font-weight:bold;
              color:#2e7d32;
              margin-bottom:6px;
            ">

            🗓️ 전체 여정:
            ${team.itineraryStr}

          </div>


          ${
            team.memo
              ? `
                <div class="memo-box">

                  <b>📌 메모:</b>
                  ${esc(team.memo)}

                </div>
              `
              : ""
          }

      `;


      let targetAllocations = [];


      /*
       * 오늘이 신규 출국인 경우
       * 출국 객실
       *
       * 과거 왕복의 재출국인 경우
       * 재출국 객실
       */

      if(!team.isSplitRoom){

        targetAllocations =
          team.allocations || [];

      }else{

        targetAllocations =
          team.inAllocations || [];

        /*
         * 신규 출국은 outAllocations
         */

        if(!isReturn){

          targetAllocations =
            team.outAllocations || [];

        }

      }


      const teamTotalRooms =
        targetAllocations.reduce(
          (s,a) =>
            s + (a.roomsNeeded || 0),
          0
        );


      teamResultsHtml += `

        <div class="table-responsive">

          <table>

            <thead>

              <tr>

                <th>
                  출국 승선 객실 종류
                </th>

                <th>
                  인원
                </th>

                <th>
                  수용 설정
                </th>

                <th>
                  필요 객실 (${teamTotalRooms}실)
                </th>

                <th>
                  보유 대비 비중
                </th>

              </tr>

            </thead>

            <tbody>

      `;


      targetAllocations.forEach(a => {

        const roomHoldPct =
          a.totalRooms > 0
            ? (
                a.roomsNeeded /
                a.totalRooms *
                100
              ).toFixed(1)
              +
              `% (${a.roomsNeeded}/${a.totalRooms}개)`
            : "—";


        teamResultsHtml += `

          <tr>

            <td>
              <b>${esc(a.label)}</b>
            </td>

            <td>
              ${a.people}명
            </td>

            <td>
              ${a.cap}명/실
            </td>

            <td>
              ${a.roomsNeeded}개
            </td>

            <td>
              <b>${roomHoldPct}</b>
            </td>

          </tr>

        `;

      });


      teamResultsHtml += `

            </tbody>

          </table>

        </div>

        </div>

      `;

    });

  }


  document.getElementById(
    "teamResultsContainer"
  ).innerHTML =
    teamResultsHtml;


  document.getElementById(
    "simResult"
  ).classList.remove("hidden");


  /* =========================================================
     Firebase 저장
  ========================================================= */

  if(
    shouldSave &&
    db &&
    selectedDate
  ){

    db.collection("schedules")
      .doc(selectedDate)
      .set({

        totalPeople:
          grandTotalPeople,

        groupTotalPeople:
          groupTotalPeople,

        teamCount:
          todayTeams.length,

        masterRooms:
          masterRooms,

        teams:
          todayTeams,

        updatedAt:
          new Date()

      })
      .then(() => {

        alert(
          `[${selectedDate}] 일정 정보가 저장되었습니다.`
        );


        if(calendar){

          calendar.refetchEvents();

        }

      })
      .catch(err => {

        alert(
          "저장 실패: " + err
        );

      });

  }

}


/* =========================================================
   날짜 데이터 삭제
========================================================= */

function deleteDateData(){

  if(!selectedDate) return;


  if(
    confirm(
      `정말로 ${selectedDate} 날짜의 데이터를 삭제하시겠습니까?`
    )
  ){

    if(db){

      db.collection("schedules")
        .doc(selectedDate)
        .delete()
        .then(() => {

          alert("삭제되었습니다.");

          closeSimSection();

          if(calendar){

            calendar.refetchEvents();

          }

        });

    }

  }

}


/* =========================================================
   PNG 다운로드
========================================================= */

function downloadResultImage(){

  const area =
    document.getElementById(
      "captureArea"
    );


  html2canvas(
    area,
    {
      scale:2,
      backgroundColor:"#f4f6f9"
    }
  )
  .then(canvas => {

    const link =
      document.createElement("a");


    link.download =
      `단동훼리_객실배정_${selectedDate}.png`;


    link.href =
      canvas.toDataURL(
        "image/png"
      );


    link.click();

  });

}


/* =========================================================
   월간 Excel 다운로드
========================================================= */

/*
 * 월/수/금 → OUT
 * 화/목/토 → IN
 *
 * 일요일은 실제 운항 요일이 아니므로
 * Excel에서 제외
 *
 * 중요한 점:
 *
 * 달력에서는 왕복을
 * "출국 → 출국"으로 계산하지만
 *
 * Excel에서만 해당 날짜의 요일에 따라
 * OUT / IN을 구분
 */

function getExcelDirection(dateStr){

  const date =
    new Date(
      dateStr + "T00:00:00"
    );


  const day =
    date.getDay();


  /*
   * 일요일 = 0
   * 월요일 = 1
   * 화요일 = 2
   * 수요일 = 3
   * 목요일 = 4
   * 금요일 = 5
   * 토요일 = 6
   */

  if(
    day === 1 ||
    day === 3 ||
    day === 5
  ){

    return "OUT";

  }


  if(
    day === 2 ||
    day === 4 ||
    day === 6
  ){

    return "IN";

  }


  return "";

}


/*
 * 엑셀 다운로드
 *
 * 현재 달력에 표시되어 있는 달을 기준으로
 * 한 달치 자료 생성
 */

async function downloadMonthlyExcel(){

  if(!db){

    alert(
      "Firebase 연결이 되어 있지 않습니다."
    );

    return;

  }


  if(
    typeof XLSX === "undefined"
  ){

    alert(
      "Excel 기능을 불러오지 못했습니다. 페이지를 새로고침해주세요."
    );

    return;

  }


  try{

    /*
     * 현재 달력의 기준 날짜
     */

    const calendarDate =
      calendar
        ? calendar.getDate()
        : new Date();


    const year =
      calendarDate.getFullYear();


    const month =
      calendarDate.getMonth();


    /*
     * 해당 월의 시작 / 마지막
     */

    const firstDate =
      new Date(
        year,
        month,
        1
      );


    const lastDate =
      new Date(
        year,
        month + 1,
        0
      );


    const firstStr =
      formatDateISO(firstDate);


    const lastStr =
      formatDateISO(lastDate);


    /*
     * 전체 schedules 조회
     */

    const snapshot =
      await db
        .collection("schedules")
        .get();


    const rows = [];


    /*
     * 월간 총합
     */

    let totalPeople = 0;


    /*
     * OUT / IN 별 합계
     */

    let totalOut = 0;

    let totalIn = 0;


    snapshot.forEach(doc => {

      const regDate =
        doc.id;


      const data =
        doc.data();


      if(
        !data.teams ||
        data.teams.length === 0
      ){

        return;

      }


      data.teams.forEach(team => {

        const pattern =
          normalizePattern(
            team.pattern
          );


        const people =
          parseInt(
            team.totalPeople,
            10
          ) || 0;


        if(people <= 0){
          return;
        }


        /*
         * 이 단체가 출발하는 날짜들을 생성
         */

        const departureDates = [];


        /*
         * 최초 출국
         */

        if(
          pattern === "ROUND" ||
          pattern === "ONEWAY_OUT"
        ){

          departureDates.push(
            regDate
          );

        }


        /*
         * 왕복의 재출국
         */

        if(pattern === "ROUND"){

          const nights =
            parseInt(
              team.nights || 4,
              10
            );


          const returnDate =
            getReturnDate(
              regDate,
              nights
            );


          departureDates.push(
            returnDate
          );

        }


        /*
         * 입국 편도는
         * "출국 일정" 엑셀에서 제외
         *
         * 사용자가 요청한 엑셀은
         * 월/수/금 OUT
         * 화/목/토 IN
         * 기준의 출발 통계이므로
         * 실제 출발 날짜가 있는 일정만 취급
         */

        departureDates.forEach(departureDate => {

          /*
           * 해당 월만
           */

          if(
            departureDate < firstStr ||
            departureDate > lastStr
          ){

            return;

          }


          const direction =
            getExcelDirection(
              departureDate
            );


          /*
           * 일요일 제외
           */

          if(!direction){
            return;
          }


          if(direction === "OUT"){

            totalOut += people;

          }else if(direction === "IN"){

            totalIn += people;

          }


          totalPeople +=
            people;


          rows.push({

            "날짜":
              departureDate,

            "구분":
              direction,

            "단체명":
              team.name ||
              "단체",

            "인원":
              people

          });

        });

      });

    });


    /*
     * 날짜 → 구분 → 단체명 순 정렬
     */

    rows.sort((a,b) => {

      if(a["날짜"] !== b["날짜"]){

        return a["날짜"]
          .localeCompare(
            b["날짜"]
          );

      }


      if(a["구분"] !== b["구분"]){

        return a["구분"] === "OUT"
          ? -1
          : 1;

      }


      return a["단체명"]
        .localeCompare(
          b["단체명"]
        );

    });


    /*
     * 총합계 행
     */

    const excelRows = [
      ...rows,

      {
        "날짜":"",
        "구분":"",
        "단체명":"총 합계",
        "인원":totalPeople
      }

    ];


    /*
     * Sheet 생성
     */

    const worksheet =
      XLSX.utils.json_to_sheet(
        excelRows
      );


    /*
     * 열 너비
     */

    worksheet["!cols"] = [

      { wch:12 },

      { wch:10 },

      { wch:30 },

      { wch:10 }

    ];


    /*
     * 총합계 행 위치
     */

    const totalRowIndex =
      excelRows.length;


    /*
     * 총합계 행을 굵게
     *
     * SheetJS 기본 버전에서는
     * 스타일 적용이 제한적이므로
     * 숫자/내용 위주로 안정적으로 저장
     */


    /*
     * Workbook 생성
     */

    const workbook =
      XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
      workbook,
      worksheet,
      "월간 단체 요약"
    );


    /*
     * 파일명
     */

    const monthText =
      String(month + 1)
        .padStart(2,"0");


    const fileName =
      `단동훼리_단체요약_${year}${monthText}.xlsx`;


    /*
     * 다운로드
     */

    XLSX.writeFile(
      workbook,
      fileName
    );


  }catch(error){

    console.error(
      "월간 Excel 다운로드 오류:",
      error
    );


    alert(
      "Excel 다운로드 중 오류가 발생했습니다.\n\n" +
      error.message
    );

  }

}


/* =========================================================
   Date → YYYY-MM-DD
========================================================= */

function formatDateISO(date){

  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");


  const d =
    String(
      date.getDate()
    ).padStart(2,"0");


  return `${y}-${m}-${d}`;

}
